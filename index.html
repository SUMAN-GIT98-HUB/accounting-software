/* ============================= FIXED ASSET REGISTER ============================= */
// NFRS-style (NAS 16) movement schedule: each Asset Class rolls up to one Non-Current
// Asset ledger (whose GL balance IS the net book value — no separate contra/accumulated
// depreciation ledger) and one Depreciation Expense ledger. The register is a subsidiary
// schedule computed independently of the GL and reconciled to it; "Post Depreciation"
// writes the period's charge into the GL as a normal journal entry.
function assetCategoryById(id){ return state.assetCategories.find(c=>c.id===id); }
function assetsInCategory(id){ return state.assets.filter(a=>a.categoryId===id); }
function isoAddDays(dateStr, n){ const d = new Date(dateStr+'T00:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function isoAddYears(dateStr, n){ const d = new Date(dateStr+'T00:00:00'); d.setFullYear(d.getFullYear()+n); return d.toISOString().slice(0,10); }
function isoPrevDay(dateStr){ return isoAddDays(dateStr,-1); }
function daysBetweenISO(a,b){ return Math.round((new Date(b+'T00:00:00') - new Date(a+'T00:00:00'))/86400000); }
function yearsBetweenISO(a,b){ return daysBetweenISO(a,b)/365; }
function ledgerBalanceAt(ledgerId, atDate){
  const l = ledgerById(ledgerId); if(!l) return null;
  let bal = l.openingType==='Dr' ? Number(l.openingBalance||0) : -Number(l.openingBalance||0);
  entriesUpTo(atDate).forEach(e=> e.lines.forEach(ln=>{ if(ln.ledgerId===ledgerId) bal += Number(ln.debit||0)-Number(ln.credit||0); }));
  return bal;
}
// Net book value of a single asset as at a given date (inclusive), under its category's policy.
function assetNBVAt(asset, cat, atDate){
  const cost = Number(asset.cost||0);
  const residual = Math.min(Number(asset.residualValue||0), cost);
  if(!cat || !asset.acquisitionDate || atDate < asset.acquisitionDate) return cost;
  const depreciable = Math.max(0, cost-residual);
  if(depreciable<=0) return residual;
  if(cat.method==='WDV'){
    const rate = Number(cat.rate||0)/100;
    if(rate<=0) return cost;
    let nbv = cost, cursor = asset.acquisitionDate, guard = 0;
    while(cursor < atDate && guard<500){
      const next = isoAddYears(cursor,1);
      const segEnd = next < atDate ? next : atDate;
      const frac = yearsBetweenISO(cursor, segEnd);
      nbv = Math.max(residual, nbv - nbv*rate*frac);
      cursor = segEnd; guard++;
    }
    return nbv;
  }
  // Straight-line: rate is % of the depreciable amount p.a.; if left blank, derived from useful life.
  const annualRate = Number(cat.rate||0)>0 ? Number(cat.rate)/100 : (Number(cat.usefulLifeYears||0)>0 ? 1/Number(cat.usefulLifeYears) : 0);
  if(annualRate<=0) return cost;
  const yrs = yearsBetweenISO(asset.acquisitionDate, atDate);
  const accDep = Math.min(depreciable, depreciable*annualRate*yrs);
  return cost-accDep;
}
// Movement for one asset within [periodStart, periodEnd]. Returns null if the asset falls
// entirely outside the period (not yet acquired, or already disposed before it started).
function computeAssetPeriodRow(asset, cat, periodStart, periodEnd){
  const acquired = asset.acquisitionDate;
  if(!acquired || acquired > periodEnd) return null;
  const disposed = asset.status==='Disposed' && asset.disposalDate ? asset.disposalDate : null;
  if(disposed && disposed < periodStart) return null;
  const openingDate = isoPrevDay(periodStart);
  const openingNBV = acquired <= openingDate ? assetNBVAt(asset,cat,openingDate) : 0;
  const addition = (acquired >= periodStart && acquired <= periodEnd) ? Number(asset.cost||0) : 0;
  const isDisposedThisPeriod = !!(disposed && disposed<=periodEnd);
  const effectiveEnd = isDisposedThisPeriod ? disposed : periodEnd;
  const nbvAtEffectiveEnd = assetNBVAt(asset,cat,effectiveEnd);
  let depreciation = (openingNBV+addition) - nbvAtEffectiveEnd;
  if(depreciation < 0) depreciation = 0;
  const proceeds = isDisposedThisPeriod ? Number(asset.disposalProceeds||0) : null;
  const gainLoss = isDisposedThisPeriod ? Math.round((proceeds-nbvAtEffectiveEnd)*100)/100 : null;
  const closingNBV = isDisposedThisPeriod ? 0 : nbvAtEffectiveEnd;
  return {asset, cat, openingNBV, addition, depreciation, isDisposedThisPeriod, nbvAtDisposal: isDisposedThisPeriod?nbvAtEffectiveEnd:null, proceeds, gainLoss, closingNBV};
}
function computeFixedAssetRegister(periodStart, periodEnd){
  const catRows = state.assetCategories.map(cat=>{
    const rows = assetsInCategory(cat.id).map(a=>computeAssetPeriodRow(a,cat,periodStart,periodEnd)).filter(Boolean);
    const sum = k => rows.reduce((s,r)=>s+r[k],0);
    const glBalance = cat.assetLedgerId ? ledgerBalanceAt(cat.assetLedgerId, periodEnd) : null;
    const closingNBV = sum('closingNBV');
    return {
      cat, rows,
      openingNBV: sum('openingNBV'), additions: sum('addition'), depreciation: sum('depreciation'),
      disposalsNBV: rows.filter(r=>r.isDisposedThisPeriod).reduce((s,r)=>s+r.nbvAtDisposal,0),
      gainLoss: rows.filter(r=>r.isDisposedThisPeriod).reduce((s,r)=>s+(r.gainLoss||0),0),
      closingNBV, glBalance, variance: glBalance!=null ? Math.round((closingNBV-glBalance)*100)/100 : null
    };
  });
  const totals = ['openingNBV','additions','depreciation','disposalsNBV','gainLoss','closingNBV'].reduce((o,k)=>{ o[k]=catRows.reduce((s,c)=>s+c[k],0); return o; },{});
  return {catRows, totals};
}

/* ---- Depreciation posting ---- */
function isDepreciationPosted(catId){
  return state.entries.some(e=>e.isDepPosting && e.depCategoryId===catId && e.depPeriodEnd===state.meta.periodEnd);
}
function postDepreciationForCategory(catId, opts){
  const silent = opts && opts.silent;
  const reg = computeFixedAssetRegister(state.meta.periodStart, state.meta.periodEnd);
  const row = reg.catRows.find(c=>c.cat.id===catId);
  if(!row || row.depreciation<=0.004){ if(!silent) toast('No depreciation due for this class'); return false; }
  if(isDepreciationPosted(catId)){ if(!silent) toast('Already posted for this period'); return false; }
  const amt = Math.round(row.depreciation*100)/100;
  state.entries.push({
    id:uid('e'), date: state.meta.periodEnd, voucherType:'Journal', voucher: nextVoucherNo('Journal'),
    narration: `Depreciation for the period ${state.meta.periodStart} to ${state.meta.periodEnd} — ${row.cat.name}`,
    lines: [ {ledgerId: row.cat.depExpenseLedgerId, debit: amt, credit:0}, {ledgerId: row.cat.assetLedgerId, debit:0, credit: amt} ],
    isDepPosting:true, depCategoryId: catId, depPeriodEnd: state.meta.periodEnd
  });
  if(!silent){ persist(); render(); toast('Depreciation posted for '+row.cat.name); }
  return true;
}
function postAllDepreciation(){
  const reg = computeFixedAssetRegister(state.meta.periodStart, state.meta.periodEnd);
  const pending = reg.catRows.filter(c=>c.depreciation>0.004 && !isDepreciationPosted(c.cat.id));
  if(!pending.length){ toast('Nothing to post — already posted or zero for this period'); return; }
  pending.forEach(c=>postDepreciationForCategory(c.cat.id, {silent:true}));
  persist(); render(); toast('Depreciation posted for '+pending.length+' class'+(pending.length===1?'':'es'));
}

/* ---- Disposal posting ---- */
function isDisposalPosted(assetId){
  return state.entries.some(e=>e.isDisposalPosting && e.disposalAssetId===assetId);
}
function startPostDisposal(assetId){ postingDisposalAssetId=assetId; render(); }
function cancelPostDisposal(){ postingDisposalAssetId=null; render(); }
function postDisposalEntry(assetId){
  const a = state.assets.find(x=>x.id===assetId);
  if(!a || a.status!=='Disposed'){ toast('Asset is not marked disposed'); return; }
  if(isDisposalPosted(assetId)){ toast('Disposal entry already posted for this asset'); return; }
  const cat = assetCategoryById(a.categoryId);
  const cashLedgerId = document.getElementById('dp-cash-ledger').value;
  const glLedgerId = document.getElementById('dp-gainloss-ledger').value;
  if(!cashLedgerId){ toast('Select the ledger receiving disposal proceeds'); return; }
  const nbv = Math.round(assetNBVAt(a, cat, a.disposalDate)*100)/100;
  const proceeds = Math.round(Number(a.disposalProceeds||0)*100)/100;
  const gainLoss = Math.round((proceeds-nbv)*100)/100;
  if(Math.abs(gainLoss)>0.004 && !glLedgerId){ toast('Select a Gain/Loss on Disposal ledger'); return; }
  const lines = [];
  if(proceeds>0.004) lines.push({ledgerId:cashLedgerId, debit:proceeds, credit:0});
  if(nbv>0.004) lines.push({ledgerId:cat.assetLedgerId, debit:0, credit:nbv});
  if(gainLoss>0.004) lines.push({ledgerId:glLedgerId, debit:0, credit:gainLoss});
  if(gainLoss<-0.004) lines.push({ledgerId:glLedgerId, debit:-gainLoss, credit:0});
  if(lines.length<2){ toast('Nothing to post'); return; }
  state.entries.push({
    id:uid('e'), date:a.disposalDate, voucherType:'Journal', voucher: nextVoucherNo('Journal'),
    narration:`Disposal of ${a.name}${cat?' ('+cat.name+')':''}`,
    lines, isDisposalPosting:true, disposalAssetId:assetId
  });
  persist(); postingDisposalAssetId=null; render(); toast('Disposal entry posted');
}

/* ============================= INVENTORY REGISTER ============================= */
// NAS 2-style perpetual stock ledger: each item's quantity and cost are tracked
// transaction-by-transaction (Purchases, Sales/Issues, Adjustments) using either
// FIFO or Moving Weighted Average costing (chosen per item). Like the Fixed Asset
// Register, this is a subsidiary schedule — it doesn't post to the GL itself; you
// still record the usual purchase/sales journal entries, and can optionally link
// one Inventory ledger below purely to check the register's closing value against it.
function stockItemById(id){ return state.stockItems.find(i=>i.id===id); }
function txnsForItem(itemId){ return state.stockTxns.filter(t=>t.itemId===itemId).sort((a,b)=> a.date<b.date?-1:a.date>b.date?1:0); }

// Consumes `takeQty` units from a running (qty, value, layers) position — via FIFO
// layers or the running weighted-average rate — and returns the cost removed.
// Shared by Sales and negative Adjustments; mutates the passed-in position object.
function stockConsume(pos, takeQty, method){
  let remaining = takeQty, cost = 0;
  if(method==='FIFO'){
    while(remaining>0.00001 && pos.layers.length){
      const layer = pos.layers[0];
      const take = Math.min(layer.qty, remaining);
      cost += take*layer.rate;
      layer.qty -= take; remaining -= take;
      if(layer.qty<=0.00001) pos.layers.shift();
    }
    if(remaining>0.00001){ // oversold beyond tracked layers — fall back to last known avg rate
      const lastRate = pos.qty>0.00001 ? pos.value/pos.qty : 0;
      cost += remaining*lastRate;
    }
  } else {
    const avgRate = pos.qty>0.00001 ? pos.value/pos.qty : 0;
    cost = takeQty*avgRate;
  }
  pos.qty -= takeQty; pos.value -= cost;
  if(pos.qty<0.00001) pos.qty = 0;
  if(pos.value<0.00001) pos.value = 0;
  if(method!=='FIFO'){ pos.layers = pos.qty>0.00001 ? [{qty:pos.qty, rate:pos.value/pos.qty}] : []; }
  return cost;
}
// Point-in-time balance for one item, replaying its opening balance + every
// transaction dated on or before atDate.
function computeItemStockAt(item, atDate){
  const method = item.costMethod || 'WAVG';
  const openQty = Number(item.openingQty||0), openRate = Number(item.openingRate||0);
  const pos = {qty: openQty, value: openQty*openRate, layers: openQty>0.00001?[{qty:openQty,rate:openRate}]:[]};
  txnsForItem(item.id).filter(t=>t.date<=atDate).forEach(t=> applyStockTxn(pos, t, method));
  return {qty: pos.qty, value: pos.value, avgRate: pos.qty>0.00001 ? pos.value/pos.qty : 0, layers: pos.layers};
}
function applyStockTxn(pos, t, method){
  const tqty = Number(t.qty||0);
  if(t.type==='Purchase'){
    const rate = Number(t.rate||0);
    pos.qty += tqty; pos.value += tqty*rate;
    pos.layers.push({qty:tqty, rate});
  } else if(t.type==='Sale'){
    stockConsume(pos, tqty, method);
  } else if(t.type==='Adjustment'){
    if(tqty>=0){
      const rate = Number(t.rate||0) || (pos.qty>0.00001 ? pos.value/pos.qty : 0);
      pos.qty += tqty; pos.value += tqty*rate;
      pos.layers.push({qty:tqty, rate});
    } else {
      stockConsume(pos, -tqty, method);
    }
  }
}
// Movement for one item within [periodStart, periodEnd]: starts from the opening
// snapshot (as at the day before periodStart) and replays only the period's own
// transactions, so purchases/sales/adjustments are correctly split out.
function computeItemPeriodRow(item, periodStart, periodEnd){
  const method = item.costMethod || 'WAVG';
  const opening = computeItemStockAt(item, isoPrevDay(periodStart));
  const pos = {qty:opening.qty, value:opening.value, layers: opening.layers.map(l=>({...l}))};
  let purchaseQty=0, purchaseValue=0, saleQty=0, saleCost=0, saleRevenue=0, adjQty=0, adjValue=0;
  txnsForItem(item.id).filter(t=>t.date>=periodStart && t.date<=periodEnd).forEach(t=>{
    const tqty = Number(t.qty||0);
    if(t.type==='Purchase'){
      const rate = Number(t.rate||0);
      applyStockTxn(pos, t, method);
      purchaseQty += tqty; purchaseValue += tqty*rate;
    } else if(t.type==='Sale'){
      const cost = stockConsume(pos, tqty, method);
      saleQty += tqty; saleCost += cost; saleRevenue += tqty*Number(t.salePrice||0);
    } else if(t.type==='Adjustment'){
      if(tqty>=0){
        const valBefore = pos.value;
        applyStockTxn(pos, t, method);
        adjQty += tqty; adjValue += (pos.value-valBefore);
      } else {
        const cost = stockConsume(pos, -tqty, method);
        adjQty += tqty; adjValue -= cost;
      }
    }
  });
  return {item, openingQty:opening.qty, openingValue:opening.value, purchaseQty, purchaseValue,
    saleQty, saleCost, saleRevenue, grossProfit: saleRevenue-saleCost, adjQty, adjValue,
    closingQty: pos.qty, closingValue: pos.value, avgRate: pos.qty>0.00001 ? pos.value/pos.qty : 0};
}
function computeInventoryReport(periodStart, periodEnd){
  const rows = state.stockItems.map(it=>computeItemPeriodRow(it, periodStart, periodEnd));
  const sum = k => rows.reduce((s,r)=>s+r[k],0);
  const totals = ['openingValue','purchaseValue','saleCost','saleRevenue','grossProfit','adjValue','closingValue'].reduce((o,k)=>{ o[k]=sum(k); return o; },{});
  return {rows, totals};
}

function stockItemEditRow(it){

    <td>
      <div style="display:flex;gap:6px;">
        <input type="number" step="0.001" id="si-openqty" value="${it.openingQty}" placeholder="Qty" style="width:75px;">

      </div>
      <p class="hint" style="margin:6px 0 0;">Reorder level (optional): <input type="number" step="0.001" id="si-reorder" value="${it.reorderLevel||0}" style="width:75px;display:inline-block;"></p>
    </td>
    <td><select id="si-method"><option value="WAVG" ${it.costMethod!=='FIFO'?'selected':''}>Weighted Avg</option><option value="FIFO" ${it.costMethod==='FIFO'?'selected':''}>FIFO</option></select></td>
    <td class="actions-cell">
      <button class="btn small" onclick="saveStockItem('${isNew?'':it.id}')">Save</button>
      <button class="btn secondary small" onclick="cancelStockItemEdit()">Cancel</button>

}
function editStockItem(id){ editingStockItemId=id; render(); }
function cancelStockItemEdit(){ editingStockItemId=null; render(); }
function saveStockItem(id){
  const name = document.getElementById('si-name').value.trim();
  if(!name){ toast('Item name is required'); return; }
  const unit = document.getElementById('si-unit').value.trim() || 'pcs';
  const category = document.getElementById('si-category').value.trim();
  const openingQty = Number(document.getElementById('si-openqty').value||0);
  const openingRate = Number(document.getElementById('si-openrate').value||0);
  const costMethod = document.getElementById('si-method').value;
  const reorderLevel = Number(document.getElementById('si-reorder').value||0);
  if(id){
    Object.assign(stockItemById(id), {name,unit,category,openingQty,openingRate,costMethod,reorderLevel});
  } else {
    state.stockItems.push({id:uid('si'), name,unit,category,openingQty,openingRate,costMethod,reorderLevel});
  }
  persist(); editingStockItemId=null; render(); toast('Item saved');
}
function deleteStockItem(id){
  if(!confirm('Delete this item? Its transactions will also be removed from the register.')) return;
  state.stockItems = state.stockItems.filter(i=>i.id!==id);
  state.stockTxns = state.stockTxns.filter(t=>t.itemId!==id);
  persist(); render(); toast('Item deleted');
}

/* ---- Stock Transaction CRUD ---- */
function startAddStockTxn(type, itemId){
  editingStockTxnId = null;
  stockTxnFormType = type || 'Purchase';
  selectedStockItemId = itemId || (state.stockItems[0]?.id || null);
  render();
}
function editStockTxn(id){
  const t = state.stockTxns.find(x=>x.id===id);
  if(!t) return;
  editingStockTxnId = id; stockTxnFormType = t.type; selectedStockItemId = t.itemId;
  render();
}
function cancelStockTxnForm(){ editingStockTxnId=null; stockTxnFormType=null; render(); }
function saveStockTxn(id){
  const itemId = document.getElementById('st-item').value;
  const type = document.getElementById('st-type').value;
  const date = document.getElementById('st-date').value;
  const qty = Number(document.getElementById('st-qty').value||0);
  if(!itemId){ toast('Select an item'); return; }
  if(!date){ toast('Date is required'); return; }
  if(!qty){ toast('Enter a quantity'); return; }
  if(type!=='Adjustment' && qty<0){ toast('Quantity must be positive for Purchase/Sale'); return; }
  const rateEl = document.getElementById('st-rate'), salePriceEl = document.getElementById('st-saleprice');
  const rate = rateEl ? Number(rateEl.value||0) : 0;
  const salePrice = salePriceEl ? Number(salePriceEl.value||0) : 0;
  const narration = document.getElementById('st-narr').value.trim();
  if(type==='Purchase' && rate<=0){ toast('Enter a purchase rate'); return; }
  const txn = {itemId, type, date, qty, rate, salePrice, narration};
  if(id){ Object.assign(state.stockTxns.find(t=>t.id===id), txn); }
  else { txn.id = uid('st'); state.stockTxns.push(txn); }
  persist(); editingStockTxnId=null; stockTxnFormType=null; render(); toast('Transaction saved');
}
function deleteStockTxn(id){
  if(!confirm('Delete this transaction?')) return;
  state.stockTxns = state.stockTxns.filter(t=>t.id!==id);
  persist(); render(); toast('Transaction deleted');
}

      ${reg.rows.map(r=>`
      <tr>
        <td>${esc(r.item.name)}${r.item.reorderLevel>0 && r.closingQty<Number(r.item.reorderLevel) ? ' <span class="tag cr" title="Below reorder level of '+fmt(r.item.reorderLevel)+'">Low Stock</span>':''}</td>

/* ============================= AGEING ANALYSIS ============================= */
// Ages outstanding Trade Receivables / Trade Payables balances by matching each ledger's
// debits against credits on a FIFO basis (oldest transaction cleared first) — the standard
// approach when individual invoice/bill numbers aren't tracked separately. Everything is
// computed as at a chosen "as-of" date rather than being pinned to Period End, so the view
// can reflect either the full-year close or the position as at today. A ledger's raw opening
// balance is treated as one lump transaction dated at Period Start (its true transaction-level
// date isn't known); real entries before and after that keep their actual dates.
let ageingShowDetail = false;
let ageingAsOfMode = 'periodEnd'; // 'periodEnd' | 'today'
const AGE_BUCKETS = [
  {label:'0–30 days', max:30},
  {label:'31–60 days', max:60},
  {label:'61–90 days', max:90},
  {label:'91–180 days', max:180},
  {label:'Over 180 days', max:Infinity},
];
function daysBetween(fromDateStr, toDateStr){
  const d1 = new Date(fromDateStr+'T00:00:00'), d2 = new Date(toDateStr+'T00:00:00');
  return Math.round((d2-d1)/86400000);
}
function bucketFor(days){
  for(const b of AGE_BUCKETS){ if(days<=b.max) return b.label; }
  return AGE_BUCKETS[AGE_BUCKETS.length-1].label;
}
function ageingAsOfDate(){
  return ageingAsOfMode==='today' ? todayISO() : state.meta.periodEnd;
}
// Reconstructs a ledger's transaction history up to `asOf`, keeping real transaction dates
// throughout and only substituting Period Start for the (date-less) opening balance.
function ledgerRawTxns(ledger, asOf){
  const ps = state.meta.periodStart;
  const upTo = entriesUpTo(asOf); // already sorted ascending by date, then id
  const txns = [];
  upTo.filter(e=> e.date < ps).forEach(e=> e.lines.forEach(ln=>{
    if(ln.ledgerId===ledger.id) txns.push({date:e.date, debit:Number(ln.debit||0), credit:Number(ln.credit||0), narration:e.narration||''});
  }));
  const ob = Number(ledger.openingBalance||0);
  if(ob>0.004 && ps<=asOf){
    txns.push({date: ps, debit: ledger.openingType==='Dr'?ob:0, credit: ledger.openingType==='Cr'?ob:0, narration:'Opening Balance'});
  }
  upTo.filter(e=> e.date >= ps).forEach(e=> e.lines.forEach(ln=>{
    if(ln.ledgerId===ledger.id) txns.push({date:e.date, debit:Number(ln.debit||0), credit:Number(ln.credit||0), narration:e.narration||''});
  }));
  return txns;
}
// direction 'Dr' = debits increase the balance (Trade Receivables); 'Cr' = credits increase it (Trade Payables)
function fifoAgeing(ledger, direction, asOf){
  const txns = ledgerRawTxns(ledger, asOf);
  const queue = [];
  let overpay = 0;
  txns.forEach(t=>{
    const incAmt = direction==='Dr' ? t.debit : t.credit;
    const decAmt = direction==='Dr' ? t.credit : t.debit;
    if(incAmt>0.004) queue.push({date:t.date, remaining:incAmt, narration:t.narration});
    if(decAmt>0.004){
      let toConsume = decAmt;
      for(let i=0;i<queue.length && toConsume>0.004;i++){
        if(queue[i].remaining<=0.004) continue;
        const c = Math.min(queue[i].remaining, toConsume);
        queue[i].remaining -= c; toConsume -= c;
      }
      if(toConsume>0.004) overpay += toConsume;
    }
  });
  return {open: queue.filter(q=>q.remaining>0.004), overpay};
}
function computeAgeing(asOf){
  asOf = asOf || state.meta.periodEnd;
  const arGroups = state.groups.filter(g=> g.nature==='Asset' && /receivable/i.test(g.name||''));
  const apGroups = state.groups.filter(g=> g.nature==='Liability' && /payable/i.test(g.name||'') && !/tds|vat|tax/i.test(g.name||''));
  function build(groups, direction){
    const ledgerRows = [];
    const bucketTotals = {}; AGE_BUCKETS.forEach(b=>bucketTotals[b.label]=0);
    let grandTotal = 0, grandOverpay = 0;
    groups.forEach(g=>{
      ledgersInGroup(g.id).forEach(l=>{
        const {open, overpay} = fifoAgeing(l, direction, asOf);
        if(!open.length && overpay<=0.004) return;
        const items = open.map(o=>({...o, days: daysBetween(o.date, asOf)}));
        const row = {ledger:l, group:g, buckets:{}, total:0, overpay, items};
        AGE_BUCKETS.forEach(b=>row.buckets[b.label]=0);
        items.forEach(it=>{
          const label = bucketFor(it.days);
          row.buckets[label] += it.remaining;
          row.total += it.remaining;
          bucketTotals[label] += it.remaining;
        });
        grandTotal += row.total;
        grandOverpay += overpay;
        ledgerRows.push(row);
      });
    });
    return {ledgerRows, bucketTotals, grandTotal, grandOverpay};
  }
  return {ar: build(arGroups,'Dr'), ap: build(apGroups,'Cr'), asOf, arGroups, apGroups};
}
// Recomputes each matched ledger's balance as at `asOf` directly (opening balance + all
// entries up to that date) so the reconciliation check is valid at any as-of date, not just
// Period End — the main computeTrialBalance() is always pinned to Period End.
function balanceAsOf(ledgerIds, asOf, direction){
  let total = 0;
  state.ledgers.filter(l=>ledgerIds.includes(l.id)).forEach(l=>{
    let bal = l.openingType==='Dr' ? Number(l.openingBalance||0) : -Number(l.openingBalance||0);
    entriesUpTo(asOf).forEach(e=> e.lines.forEach(ln=>{ if(ln.ledgerId===l.id) bal += Number(ln.debit||0)-Number(ln.credit||0); }));
    total += direction==='Dr' ? bal : -bal;
  });
  return total;
}
function ageingReconcile(build, groups, nature, asOf){
  const groupIds = groups.map(g=>g.id);
  const ledgerIds = state.ledgers.filter(l=>groupIds.includes(l.groupId)).map(l=>l.id);
  const balNet = balanceAsOf(ledgerIds, asOf, nature==='Asset'?'Dr':'Cr');
  const ageingNet = build.grandTotal - build.grandOverpay;
  const diff = balNet - ageingNet;
  const ok = Math.abs(diff)<0.01;
  return `<p class="hint ${ok?'badge-ok':'badge-bad'}" style="margin-top:10px;">${ok? '✓ Reconciles with the ledger balance as at '+asOf+'.' : '⚠ Differs from the ledger balance as at '+asOf+' by '+fmt(diff)+' — check for ledgers outside the matched groups, or lines missing an amount.'}</p>`;
}
function ageingToggleBar(){
  const pe = state.meta.periodEnd, td = todayISO();
  return `<div class="no-print" style="display:inline-flex;border:1px solid var(--rule-strong);border-radius:4px;overflow:hidden;margin-bottom:16px;">
    <button onclick="ageingAsOfMode='periodEnd';render();" style="border:none;padding:7px 14px;font-size:12.5px;font-weight:500;cursor:pointer;background:${ageingAsOfMode==='periodEnd'?'var(--ink)':'#fff'};color:${ageingAsOfMode==='periodEnd'?'#fff':'var(--ink)'};">As at Period End (${pe})</button>
    <button onclick="ageingAsOfMode='today';render();" style="border:none;padding:7px 14px;font-size:12.5px;font-weight:500;cursor:pointer;background:${ageingAsOfMode==='today'?'var(--ink)':'#fff'};color:${ageingAsOfMode==='today'?'#fff':'var(--ink)'};border-left:1px solid var(--rule-strong);">As at Today (${td})</button>
  </div>`;
}
function ageingTable(build, title){
  const labels = AGE_BUCKETS.map(b=>b.label);
  let html = `<div class="card-title">${esc(title)}</div>`;
  if(!build.ledgerRows.length){
    html += `<div class="empty">No outstanding balances found.</div>`;
  } else {
    html += `<table><thead><tr><th>Ledger</th>${labels.map(l=>`<th class="num">${l}</th>`).join('')}<th class="num">Total</th></tr></thead><tbody>`;
    build.ledgerRows.forEach(r=>{
      html += `<tr><td>${esc(r.ledger.name)}</td>${labels.map(l=>`<td class="num">${r.buckets[l]>0.004?fmt(r.buckets[l]):'<span class="muted">—</span>'}</td>`).join('')}<td class="num" style="font-weight:600;">${fmt(r.total)}</td></tr>`;
    });
    html += `<tr class="total"><td>Total</td>${labels.map(l=>`<td class="num">${fmt(build.bucketTotals[l])}</td>`).join('')}<td class="num">${fmt(build.grandTotal)}</td></tr>`;
    html += `</tbody></table>`;
  }
  if(build.grandOverpay>0.004){
    html += `<p class="hint">An additional ${fmt(build.grandOverpay)} of receipts/payments exceed the invoiced amounts on a FIFO basis (advance received or credit balance carried) and isn't included in the buckets above.</p>`;
  }
  return html;
}
function ageingDetailTable(build, title){
  let html = `<div class="card-title">${esc(title)} — Item Detail</div>`;
  const allItems = [];
  build.ledgerRows.forEach(r=> r.items.forEach(it=> allItems.push({ledger:r.ledger.name, ...it})));
  if(!allItems.length) return html + `<div class="empty">No open items.</div>`;
  allItems.sort((a,b)=> b.days - a.days);
  html += `<table><thead><tr><th>Ledger</th><th>Date</th><th>Particulars</th><th class="num">Age (days)</th><th>Bucket</th><th class="num">Amount</th></tr></thead><tbody>`;
  allItems.forEach(it=>{
    html += `<tr><td>${esc(it.ledger)}</td><td class="num">${it.date}</td><td>${esc(it.narration||'—')}</td><td class="num">${it.days}</td><td>${bucketFor(it.days)}</td><td class="num">${fmt(it.remaining)}</td></tr>`;
  });
  return html + `</tbody></table>`;
}
function renderAgeing(){
  const asOf = ageingAsOfDate();
  const a = computeAgeing(asOf);
  const isPeriodEnd = asOf===state.meta.periodEnd;
  return `
  ${renderLetterhead()}
  <div class="pagehead"><div><div class="eyebrow">As at ${asOf}</div><h1>Ageing Analysis</h1><p class="sub">Outstanding Trade Receivables and Trade Payables, aged by transaction date using FIFO settlement within each ledger.</p></div>
  <div class="export-bar no-print">
    <button class="btn secondary" onclick="ageingShowDetail=!ageingShowDetail;render();">${ageingShowDetail?'Hide':'Show'} Item-Level Detail</button>
    <button class="btn secondary" onclick="exportAgeingCSV()">⬇ CSV</button>
    <button class="btn secondary" onclick="exportAgeingXLSX()">⬇ Excel</button>
    <button class="btn secondary" onclick="printCurrent()">🖶 Print / Save as PDF</button>
  </div></div>
  ${ageingToggleBar()}

  <div class="sheet">
    ${ageingTable(a.ar, 'Trade Receivables Ageing')}
    ${ageingReconcile(a.ar, a.arGroups, 'Asset', asOf)}
  </div>
  ${ageingShowDetail ? `<div class="sheet">${ageingDetailTable(a.ar,'Trade Receivables')}</div>` : ''}

  <div class="sheet">
    ${ageingTable(a.ap, 'Trade Payables Ageing')}
    ${ageingReconcile(a.ap, a.apGroups, 'Liability', asOf)}
  </div>
  ${ageingShowDetail ? `<div class="sheet">${ageingDetailTable(a.ap,'Trade Payables')}</div>` : ''}

  ${!isPeriodEnd ? `<p class="hint">Showing balances as at ${asOf}, not the period end (${state.meta.periodEnd}) — transactions dated after ${asOf} are excluded here even though they fall within the current period and are still reflected in the full-year statements.</p>` : ''}
  <p class="hint">Ledgers are matched from groups named "Trade Receivables" / "Trade Payables" (excluding TDS/VAT/Tax Payable) in the Chart of Accounts — rename these consistently if a balance seems to be missing. Opening balances are aged from the Period Start date, since their original transaction date isn't tracked. For accurate per-customer or per-vendor ageing, keep a separate ledger per customer/vendor rather than one pooled ledger.</p>`;
}
function ageingRows(asOf){
  const a = computeAgeing(asOf);
  const labels = AGE_BUCKETS.map(b=>b.label);
  const rows = [['Ageing Analysis'], ['As at '+asOf], []];
  const section = (build, title) => {
    rows.push([title]);
    rows.push(['Ledger', ...labels, 'Total']);
    build.ledgerRows.forEach(r=> rows.push([r.ledger.name, ...labels.map(l=>r.buckets[l].toFixed(2)), r.total.toFixed(2)]));
    rows.push(['Total', ...labels.map(l=>build.bucketTotals[l].toFixed(2)), build.grandTotal.toFixed(2)]);
    if(build.grandOverpay>0.004) rows.push(['Advance / Credit Balance (not aged)', build.grandOverpay.toFixed(2)]);
    rows.push([]);
    rows.push([title+' — Item Detail']);

    build.ledgerRows.forEach(r=> r.items.forEach(it=> rows.push([r.ledger.name, it.date, it.narration||'', it.days, bucketFor(it.days), it.remaining.toFixed(2)])));
    rows.push([]);
  };
  section(a.ar, 'Trade Receivables Ageing');
  section(a.ap, 'Trade Payables Ageing');
  return rows;
}

/* ============================= RATIO ANALYSIS ============================= */
// Pulls figures from the already-computed Trial Balance / SFP / P&L / Indirect Cash Flow so
// ratios stay consistent with the statements rather than re-deriving from raw entries.
// A few line items (Inventory, Prepaid Expenses, Trade Receivables/Payables, Finance Costs)
// aren't flagged individually in the group schema, so they're located by matching on group
// name against the default Chart of Accounts naming. If a group has been renamed away from
// these conventions, the affected ratio shows "—" rather than a silently wrong number.
function ratioFindAmt(tb, regex, nature){
  const rows = tb.filter(r=> r.group.nature===nature && regex.test(r.group.name||''));
  if(!rows.length) return 0;
  if(nature==='Asset' || nature==='Expense') return rows.reduce((s,r)=>s+(r.dr-r.cr),0);
  return rows.reduce((s,r)=>s+(r.cr-r.dr),0); // Liability
}
function computeRatios(){
  const tb = computeTrialBalance();
  const f = plFigures();
  const s = computeSFP();
  const ind = computeIndirectCashFlow();
  const safeDiv = (a,b)=> (b!==0 && Math.abs(b)>0.004) ? a/b : null;

  const inventory = ratioFindAmt(tb, /inventory/i, 'Asset');
  const prepaid = ratioFindAmt(tb, /prepaid/i, 'Asset');
  const receivables = ratioFindAmt(tb, /receivable/i, 'Asset');
  const payables = ratioFindAmt(tb, /payable/i, 'Liability') - ratioFindAmt(tb, /tds payable|vat payable|tax payable/i, 'Liability');
  const financeCosts = ratioFindAmt(tb, /finance cost|interest expense|interest cost/i, 'Expense');

  const totalCA = s.totalCA + s.totalCash;
  const totalCL = s.totalCL;
  const totalAssets = s.totalAssets;
  const totalEquity = s.totalEquity;
  const totalLiabilities = s.totalNCL + s.totalCL;
  const revenue = f.revenue, cos = f.cos, netProfit = f.netProfit, grossProfit = f.grossProfit;
  const operatingCF = ind.netCashOperating;

  const receivableDaysRatio = safeDiv(receivables, revenue);
  const payableDaysRatio = safeDiv(payables, cos);
  const interestCoverage = financeCosts>0.004 ? safeDiv(netProfit + financeCosts, financeCosts) : null;

  return {
    currentRatio: safeDiv(totalCA, totalCL),
    quickRatio: safeDiv(totalCA - inventory - prepaid, totalCL),
    workingCapital: totalCA - totalCL,
    grossMargin: safeDiv(grossProfit, revenue),
    netMargin: safeDiv(netProfit, revenue),
    roa: safeDiv(netProfit, totalAssets),
    roe: safeDiv(netProfit, totalEquity),
    assetTurnover: safeDiv(revenue, totalAssets),
    inventoryTurnover: safeDiv(cos, inventory),
    receivableDays: receivableDaysRatio!==null ? receivableDaysRatio*365 : null,
    payableDays: payableDaysRatio!==null ? payableDaysRatio*365 : null,
    debtToEquity: safeDiv(totalLiabilities, totalEquity),
    debtToAssets: safeDiv(totalLiabilities, totalAssets),
    interestCoverage,
    operatingCFRatio: safeDiv(operatingCF, totalCL),
    cfToNetIncome: safeDiv(operatingCF, netProfit),
    raw:{inventory,prepaid,receivables,payables,financeCosts,totalCA,totalCL,totalAssets,totalEquity,totalLiabilities,revenue,cos,netProfit,grossProfit,operatingCF}
  };
}
function rFmt(v, type){
  if(v===null || v===undefined || !isFinite(v)) return '<span class="muted">—</span>';
  if(type==='%') return (v*100).toFixed(1)+'%';
  if(type==='x') return v.toFixed(2)+'x';
  if(type==='days') return Math.round(v)+' days';
  return fmt(v);
}
function ratioRow(label, formula, value, type){
  return `<tr><td><div>${esc(label)}</div><div class="hint" style="margin-top:2px;">${esc(formula)}</div></td><td class="num" style="white-space:nowrap;">${rFmt(value,type)}</td></tr>`;
}
function renderRatios(){
  const r = computeRatios();
  return `
  ${renderLetterhead()}
  <div class="pagehead"><div><div class="eyebrow">As at ${state.meta.periodEnd}</div><h1>Ratio Analysis</h1><p class="sub">Core liquidity, profitability, efficiency, leverage and cash-flow ratios computed from the statements above.</p></div>
  ${renderExportBar('exportRatiosCSV','exportRatiosXLSX')}</div>

  <div class="grid-cols">
    <div class="sheet">
      <div class="card-title">Liquidity</div>
      <table><tbody>
        ${ratioRow('Current Ratio','Current Assets ÷ Current Liabilities', r.currentRatio, 'x')}
        ${ratioRow('Quick Ratio (Acid-Test)','(Current Assets − Inventory − Prepaid) ÷ Current Liabilities', r.quickRatio, 'x')}
        ${ratioRow('Working Capital','Current Assets − Current Liabilities', r.workingCapital, 'num')}
      </tbody></table>
    </div>
    <div class="sheet">
      <div class="card-title">Profitability</div>
      <table><tbody>
        ${ratioRow('Gross Profit Margin','Gross Profit ÷ Revenue', r.grossMargin, '%')}
        ${ratioRow('Net Profit Margin','Net Profit ÷ Revenue', r.netMargin, '%')}
        ${ratioRow('Return on Assets (ROA)','Net Profit ÷ Total Assets', r.roa, '%')}
        ${ratioRow('Return on Equity (ROE)','Net Profit ÷ Total Equity', r.roe, '%')}
      </tbody></table>
    </div>
    <div class="sheet">
      <div class="card-title">Efficiency &amp; Activity</div>
      <table><tbody>
        ${ratioRow('Asset Turnover','Revenue ÷ Total Assets', r.assetTurnover, 'x')}
        ${ratioRow('Inventory Turnover','Cost of Sales ÷ Inventory', r.inventoryTurnover, 'x')}
        ${ratioRow('Receivable Days (DSO)','(Trade Receivables ÷ Revenue) × 365', r.receivableDays, 'days')}
        ${ratioRow('Payable Days (DPO)','(Trade Payables ÷ Cost of Sales) × 365', r.payableDays, 'days')}
      </tbody></table>
    </div>
    <div class="sheet">
      <div class="card-title">Leverage &amp; Solvency</div>
      <table><tbody>
        ${ratioRow('Debt to Equity','Total Liabilities ÷ Total Equity', r.debtToEquity, 'x')}
        ${ratioRow('Debt to Assets','Total Liabilities ÷ Total Assets', r.debtToAssets, 'x')}
        ${ratioRow('Interest Coverage Ratio','(Net Profit + Finance Costs) ÷ Finance Costs', r.interestCoverage, 'x')}
      </tbody></table>
    </div>
    <div class="sheet">

/* ---- Tax calculation — every input here comes from state.payrollTax, nothing hardcoded ---- */
function calcSlabTax(annualTaxable, slabs){
  let tax = 0, prevCap = 0;
  for(const s of slabs){
    const cap = (s.upto==null || s.upto==='') ? Infinity : Number(s.upto);
    if(annualTaxable > prevCap){
      const band = Math.min(annualTaxable, cap) - prevCap;
      tax += band * (Number(s.rate)||0)/100;
    }
    prevCap = cap;
    if(annualTaxable <= cap) break;
  }
  return tax;
}
function calcMonthlyIncomeTax(monthlyTaxableIncome, filingStatus, ssfEnrolled){
  const pt = state.payrollTax;
  const slabs = (filingStatus==='Couple' ? pt.slabsCouple : pt.slabsSingle).slice().sort((a,b)=>{
    const ca=(a.upto==null?Infinity:Number(a.upto)), cb=(b.upto==null?Infinity:Number(b.upto));
    return ca-cb;
  });
  let effectiveSlabs = slabs;
  if(pt.waiveFirstSlabIfSSF && ssfEnrolled && slabs.length){
    effectiveSlabs = slabs.map((s,i)=> i===0 ? Object.assign({}, s, {rate:0}) : s);
  }
  const annualTaxable = Math.max(0, monthlyTaxableIncome) * 12;
  const annualTax = calcSlabTax(annualTaxable, effectiveSlabs);
  let monthlyTax = annualTax / 12;
  if(pt.roundTax) monthlyTax = Math.round(monthlyTax);
  return Math.max(0, monthlyTax);
}
// Computes one payroll line's full breakdown from a snapshot of inputs (used both when
// auto-generating a run from the employee master, and live as the user edits a line).
function computePayrollLine(input){
  const pt = state.payrollTax;
  const basic = Number(input.basic||0);
  const allowances = (input.allowances||[]).reduce((s,a)=>s+Number(a.amount||0),0);
  const grossPay = basic + allowances;
  const ssfBaseAmt = pt.ssfBase==='gross' ? grossPay : basic;
  const ssfEnrolled = !!input.ssfEnrolled;
  const ssfEmployee = ssfEnrolled ? Math.round(ssfBaseAmt * (Number(pt.ssfEmployeeRate)||0)/100 * 100)/100 : 0;
  const ssfEmployer = ssfEnrolled ? Math.round(ssfBaseAmt * (Number(pt.ssfEmployerRate)||0)/100 * 100)/100 : 0;
  const citMonthly = Number(input.citMonthly||0);
  const lifeInsuranceMonthly = Number(input.lifeInsuranceMonthly||0);
  const otherAllowableMonthly = Number(input.otherAllowableMonthly||0);
  const otherDeductions = (input.otherDeductions||[]).reduce((s,d)=>s+Number(d.amount||0),0);

  // Retirement contribution deduction (SSF + CIT combined): the deductible amount is the
  // LOWEST of (a) what was actually contributed, (b) the absolute annual cap, and (c) a
  // fraction of assessable (gross) income — the standard rule, applied here monthly since
  // tax is estimated month-by-month. All three figures are editable in Tax Settings.
  const actualRetirementMonthly = ssfEmployee + citMonthly;
  const retirementCapAbsoluteMonthly = (Number(pt.retirementCombinedCap)||0) / 12;
  const retirementCapFractionMonthly = grossPay * ((Number(pt.retirementFractionPercent)||0)/100);
  const retirementDeductible = pt.ssfDeductibleFromTaxable
    ? Math.max(0, Math.min(actualRetirementMonthly, retirementCapAbsoluteMonthly, retirementCapFractionMonthly))
    : 0;
  const lifeInsuranceDeductible = Math.max(0, Math.min(lifeInsuranceMonthly, (Number(pt.lifeInsuranceCap)||0)/12));
  const otherAllowableDeductible = Math.max(0, Math.min(otherAllowableMonthly, (Number(pt.otherDeductionCap)||0)/12));

  const taxableIncome = grossPay - retirementDeductible - lifeInsuranceDeductible - otherAllowableDeductible;
  const incomeTax = calcMonthlyIncomeTax(taxableIncome, input.filingStatus, ssfEnrolled);
  const netPay = Math.round((grossPay - ssfEmployee - citMonthly - incomeTax - otherDeductions)*100)/100;
  return {
    basic, allowances:input.allowances||[], grossPay, ssfEmployee, ssfEmployer,
    citMonthly, lifeInsuranceMonthly, otherAllowableMonthly,
    retirementDeductible, lifeInsuranceDeductible, otherAllowableDeductible,
    otherDeductions:input.otherDeductions||[], otherDeductionsTotal:otherDeductions, incomeTax, netPay
  };
}
function snapshotLineFromEmployee(emp){
  const computed = computePayrollLine(emp);
  return {
    employeeId: emp.id, name: emp.name, position: emp.position||'', filingStatus: emp.filingStatus||'Single', ssfEnrolled: !!emp.ssfEnrolled,
    basic: computed.basic, allowances: (emp.allowances||[]).map(a=>({label:a.label, amount:Number(a.amount||0)})),
    citMonthly: Number(emp.citMonthly||0), lifeInsuranceMonthly: Number(emp.lifeInsuranceMonthly||0), otherAllowableMonthly: Number(emp.otherAllowableMonthly||0),
    otherDeductions: [],
    grossPay: computed.grossPay, ssfEmployee: computed.ssfEmployee, ssfEmployer: computed.ssfEmployer,
    retirementDeductible: computed.retirementDeductible, lifeInsuranceDeductible: computed.lifeInsuranceDeductible, otherAllowableDeductible: computed.otherAllowableDeductible,
    otherDeductionsTotal: computed.otherDeductionsTotal, incomeTax: computed.incomeTax, netPay: computed.netPay
  };
}
function recalcRunLine(line){
  const computed = computePayrollLine(line);
  Object.assign(line, {
    grossPay:computed.grossPay, ssfEmployee:computed.ssfEmployee, ssfEmployer:computed.ssfEmployer,
    retirementDeductible:computed.retirementDeductible, lifeInsuranceDeductible:computed.lifeInsuranceDeductible, otherAllowableDeductible:computed.otherAllowableDeductible,
    otherDeductionsTotal:computed.otherDeductionsTotal, incomeTax:computed.incomeTax, netPay:computed.netPay
  });
}
function payrollRunTotals(run){
  return run.lines.reduce((t,l)=>{
    t.basic+=Number(l.basic||0); t.allowances+=(l.allowances||[]).reduce((s,a)=>s+Number(a.amount||0),0);
    t.gross+=Number(l.grossPay||0); t.ssfEmployee+=Number(l.ssfEmployee||0); t.ssfEmployer+=Number(l.ssfEmployer||0);
    t.cit+=Number(l.citMonthly||0);
    t.otherDeductions+=Number(l.otherDeductionsTotal||0); t.tax+=Number(l.incomeTax||0); t.net+=Number(l.netPay||0);
    return t;
  }, {basic:0,allowances:0,gross:0,ssfEmployee:0,ssfEmployer:0,cit:0,otherDeductions:0,tax:0,net:0});
}

/* ---- Posting the register to the general ledger ----
   One consolidated, balanced entry per run:
     Dr Salary Expense (sum of gross pay)
     Dr Employer SSF Contribution Expense (sum of employer SSF, if any)
     Cr SSF Payable (employee + employer SSF combined — usually remitted together)
     Cr TDS on Salary Payable (income tax withheld)
     Cr Other Deductions Payable (any one-off deductions, if any)
     Cr Net Salary Payable (what's actually owed to employees until paid out) */
function ensurePayrollLedger(name, natureGuess, subCategoryGuess, isCashGuess){
  let l = state.ledgers.find(x=>x.name.trim().toLowerCase()===name.toLowerCase());
  if(l) return l.id;
  let g = state.groups.find(x=>x.name.trim().toLowerCase()===name.toLowerCase())
        || guessGroupForName(name)
        || state.groups.find(x=>x.nature===natureGuess && x.subCategory===subCategoryGuess)
        || state.groups.find(x=>x.nature===natureGuess);
  if(!g){
    g = {id:uid('g'), name: natureGuess+' — Other', nature:natureGuess, subCategory:subCategoryGuess||'', isCash:false, nonCash:false};
    state.groups.push(g);
  }
  l = {id:uid('l'), name, groupId:g.id, openingBalance:0, openingType:'Dr'};
  state.ledgers.push(l);
  return l.id;
}
function isPayrollPosted(runId){ return state.entries.some(e=>e.isPayrollPosting && e.payrollRunId===runId); }
function postPayrollRun(runId){
  const run = payrollRunById(runId);
  if(!run) return;
  if(isPayrollPosted(runId)){ toast('Already posted for this run'); return; }
  if(!run.lines.length){ toast('Nothing to post — this run has no employees'); return; }
  const t = payrollRunTotals(run);
  const salaryExpenseId = ensurePayrollLedger('Salary Expense', 'Expense', 'Indirect');
  const employerSsfExpenseId = t.ssfEmployer>0.004 ? ensurePayrollLedger('Employer SSF Contribution Expense', 'Expense', 'Indirect') : null;
  const ssfPayableId = (t.ssfEmployee+t.ssfEmployer)>0.004 ? ensurePayrollLedger('SSF Payable', 'Liability', 'Current') : null;
  const citPayableId = t.cit>0.004 ? ensurePayrollLedger('CIT Contribution Payable', 'Liability', 'Current') : null;
  const tdsPayableId = t.tax>0.004 ? ensurePayrollLedger('TDS on Salary Payable', 'Liability', 'Current') : null;
  const otherPayableId = t.otherDeductions>0.004 ? ensurePayrollLedger('Other Salary Deductions Payable', 'Liability', 'Current') : null;
  const netPayableId = ensurePayrollLedger('Net Salary Payable', 'Liability', 'Current');

  const lines = [];
  lines.push({ledgerId:salaryExpenseId, debit: Math.round(t.gross*100)/100, credit:0});
  if(employerSsfExpenseId) lines.push({ledgerId:employerSsfExpenseId, debit: Math.round(t.ssfEmployer*100)/100, credit:0});
  if(ssfPayableId) lines.push({ledgerId:ssfPayableId, debit:0, credit: Math.round((t.ssfEmployee+t.ssfEmployer)*100)/100});
  if(citPayableId) lines.push({ledgerId:citPayableId, debit:0, credit: Math.round(t.cit*100)/100});
  if(tdsPayableId) lines.push({ledgerId:tdsPayableId, debit:0, credit: Math.round(t.tax*100)/100});
  if(otherPayableId) lines.push({ledgerId:otherPayableId, debit:0, credit: Math.round(t.otherDeductions*100)/100});
  lines.push({ledgerId:netPayableId, debit:0, credit: Math.round(t.net*100)/100});

  state.entries.push({
    id:uid('e'), date: run.payDate, voucherType:'Journal', voucher: nextVoucherNo('Journal'),
    narration: `Payroll for ${run.periodLabel} — ${run.lines.length} employee${run.lines.length===1?'':'s'}`,
    lines, isPayrollPosting:true, payrollRunId: runId
  });
  run.posted = true;
  persist(); render();
  toast('Payroll posted to the ledger — Net Salary Payable will clear when you record the actual bank payment');
}

function payrollRegisterRows(run){

function printPayrollRegister(runId){
  const run = payrollRunById(runId); if(!run) return;
  const c = document.getElementById('content');
  const original = c.innerHTML;
  c.innerHTML = `<div class="print-statement-block">${renderPayrollRegisterPrintable(run)}</div>`;

  const restore = ()=>{ document.body.classList.remove('printing-all'); c.innerHTML = original; window.removeEventListener('afterprint', restore); };

  setTimeout(()=>window.print(), 60);
}
function openPayslip(runId, employeeId){ payslipRunId=runId; payslipEmployeeId=employeeId; payrollView='payslip'; render(); }
function printPayslip(runId, employeeId){
  const c = document.getElementById('content');
  const original = c.innerHTML;
  c.innerHTML = `<div class="print-statement-block">${renderPayslipDoc(runId, employeeId)}</div>`;
  document.body.classList.add('printing-all');
  const restore = ()=>{ document.body.classList.remove('printing-all'); c.innerHTML = original; window.removeEventListener('afterprint', restore); };

}
function exportPayslipXLSX(runId, employeeId){
  const run = payrollRunById(runId); const line = run && run.lines.find(l=>l.employeeId===employeeId);
  if(!line) return;
  const rows = [
    ['Payslip', line.name],
    [`${run.periodLabel} — Pay date ${run.payDate}`],
    [],
    ['Earnings','Amount'],
    ['Basic', line.basic.toFixed(2)],
    ...((line.allowances||[]).map(a=>[a.label, Number(a.amount||0).toFixed(2)])),
    ['Gross Pay', line.grossPay.toFixed(2)],
    [],
    ['Deductions','Amount'],
    ['SSF Contribution', line.ssfEmployee.toFixed(2)],
    ...((Number(line.citMonthly||0)>0 ? [['CIT Contribution', Number(line.citMonthly||0).toFixed(2)]] : [])),
    ['Income Tax (TDS)', line.incomeTax.toFixed(2)],
    ...((line.otherDeductions||[]).map(d=>[d.label, Number(d.amount||0).toFixed(2)])),
    ['Total Deductions', (line.ssfEmployee+Number(line.citMonthly||0)+line.incomeTax+line.otherDeductionsTotal).toFixed(2)],
    [],
    ['Net Pay', line.netPay.toFixed(2)]
  ];
  downloadXLSX(`Payslip_${line.name.replace(/[^a-z0-9]+/gi,'_')}_${run.periodLabel.replace(/[^a-z0-9]+/gi,'_')}.xlsx`, rows, 'Payslip');
}

function exportData(){
  const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = (state.meta.companyName||'ledger').replace(/[^a-z0-9]+/gi,'_') + '_backup.json';
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);

function importData(evt){
  const file = evt.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      if(!data.groups || !data.ledgers || !data.entries) throw new Error('Invalid file');
      state = data; persist(); render(); toast('Backup restored');
    }catch(e){ toast('Could not read that file'); }
  };
  reader.readAsText(file);
}

/* ============================= EXPORT (CSV + PRINT) ============================= */
function csvEscape(v){
  v = v==null ? '' : String(v);
  if(/[",\r\n]/.test(v)) v = '"' + v.replace(/"/g,'""') + '"';
  return v;
}
function downloadCSV(filename, rows){
  const csv = rows.map(r=> r.map(csvEscape).join(',')).join('\r\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('CSV downloaded');
}
// Builds a properly formatted worksheet inside an existing workbook: company letterhead
// (logo/name/address/contact) at the top, a bold/shaded header row for tabular reports,
// right-aligned real numbers (not text) with thousands separators, bordered cells, bold
// total/section rows, autosized columns and a frozen header — instead of a plain,
// unformatted number-and-text dump. Shared by both single-statement and "all statements"
// combined exports so every sheet in either case looks identical.
function addStatementSheet(wb, rows, sheetName){
  const ws = wb.addWorksheet((sheetName||'Sheet1').slice(0,31), {properties:{defaultRowHeight:16}});
  const maxCols = Math.max(1, ...rows.map(r=>r.length));
  const m = state.meta;
  const hasLetterhead = !!(m.companyName || m.logoDataUrl || m.address || m.email || m.phone);
  const logoColSpan = m.logoDataUrl ? 2 : 0;
  let headerRowCount = 0;
  const thin = {style:'thin', color:{argb:'FFD8DCE3'}};
  const borderAll = {top:thin,left:thin,bottom:thin,right:thin};

  // ---- Letterhead block ----
  if(hasLetterhead){
    const lastCol = Math.max(maxCols, logoColSpan+1);
    const nameRow = ws.addRow([]); headerRowCount++;
    ws.mergeCells(nameRow.number, logoColSpan+1, nameRow.number, lastCol);
    const nameCell = ws.getCell(nameRow.number, logoColSpan+1);
    nameCell.value = m.companyName || 'Company';
    nameCell.font = {bold:true, size:15, color:{argb:'FF1F2937'}};
    nameCell.alignment = {vertical:'middle'};
    nameRow.height = 22;

    if(m.address){
      const r = ws.addRow([]); headerRowCount++;
      ws.mergeCells(r.number, logoColSpan+1, r.number, lastCol);
      const c = ws.getCell(r.number, logoColSpan+1);
      c.value = m.address; c.font = {size:10, color:{argb:'FF6B7280'}}; c.alignment={vertical:'middle'};
    }
    const contactParts = [m.email, m.phone].filter(Boolean);
    if(contactParts.length){
      const r = ws.addRow([]); headerRowCount++;
      ws.mergeCells(r.number, logoColSpan+1, r.number, lastCol);
      const c = ws.getCell(r.number, logoColSpan+1);
      c.value = contactParts.join('   |   '); c.font = {size:10, color:{argb:'FF6B7280'}}; c.alignment={vertical:'middle'};
    }
    while(headerRowCount < (m.logoDataUrl ? 3 : 1)){ ws.addRow([]); headerRowCount++; }
    for(let c=1;c<=lastCol;c++){ ws.getCell(headerRowCount,c).border = {bottom:{style:'medium', color:{argb:'FF1F2937'}}}; }
    ws.addRow([]); headerRowCount++; // spacer row

    if(m.logoDataUrl){
      try{
        const match = /^data:image\/(png|jpe?g|gif);base64,/i.exec(m.logoDataUrl);
        let ext = match ? match[1].toLowerCase() : 'png';
        if(ext==='jpg') ext = 'jpeg';
        const imgId = wb.addImage({base64:m.logoDataUrl, extension: ext});
        ws.addImage(imgId, { tl:{col:0.15, row:0.15}, ext:{width:110, height:58}, editAs:'oneCell' });
      }catch(e){ /* skip logo if it can't be embedded */ }
    }
  }
  const bodyStartRow = headerRowCount + 1;

  // Find the tabular header row (e.g. "Ledger | Group | Debit | Credit ..."), if this report has one —
  // statements like P&L/SFP use label/value pairs instead and won't match.
  let headerRowIdx = -1;
  for(let i=0;i<Math.min(rows.length,8);i++){
    const nonEmpty = rows[i].filter(c=>c!=='' && c!=null).length;
    if(nonEmpty>=3){ headerRowIdx = i; break; }
  }

  rows.forEach((r,i)=>{
    const rowObj = ws.addRow(r.length ? r : []);
    const excelRowNum = rowObj.number;
    const nonEmptyCount = r.filter(c=>c!=='' && c!=null).length;
    const firstCell = (r[0]!=null ? String(r[0]) : '').trim();
    const isBlank = nonEmptyCount===0;
    const isTitle = i===0 && nonEmptyCount<=1 && !!firstCell;
    const isSubtitle = i===1 && nonEmptyCount<=1 && !!firstCell && !isTitle;
    const isHeaderRow = i===headerRowIdx;
    const isTotalRow = /\btotal\b/i.test(firstCell) || /(net (profit|loss|cash|increase|decrease)|gross profit|closing balance|working capital)/i.test(firstCell);
    const isSectionHeader = nonEmptyCount===1 && !isTitle && !isSubtitle && !isTotalRow && !isHeaderRow && firstCell && i>1;

    if(isTitle){
      ws.mergeCells(excelRowNum,1,excelRowNum,maxCols);
      const c = ws.getCell(excelRowNum,1); c.font={bold:true,size:13,color:{argb:'FF1F2937'}};
    } else if(isSubtitle){
      ws.mergeCells(excelRowNum,1,excelRowNum,maxCols);
      const c = ws.getCell(excelRowNum,1); c.font={italic:true,size:10,color:{argb:'FF6B7280'}};
    } else if(isHeaderRow){
      for(let c=1;c<=maxCols;c++){
        const cell = ws.getCell(excelRowNum,c);
        cell.font = {bold:true, size:10.5, color:{argb:'FFFFFFFF'}};
        cell.fill = {type:'pattern', pattern:'solid', fgColor:{argb:'FF334155'}};
        cell.alignment = {vertical:'middle', horizontal: c===1?'left':'right', wrapText:true};
        cell.border = borderAll;
      }
      ws.getRow(excelRowNum).height = 22;
    } else if(!isBlank){
      r.forEach((val,ci)=>{
        const cell = ws.getCell(excelRowNum, ci+1);
        const strVal = val==null ? '' : String(val);
        const isNumeric = /^-?[\d,]+\.\d{2}$/.test(strVal.trim());
        if(isNumeric){
          cell.value = parseFloat(strVal.replace(/,/g,''));
          cell.numFmt = '#,##0.00;(#,##0.00)';
          cell.alignment = {horizontal:'right'};
        } else {
          cell.value = strVal;
          cell.alignment = {horizontal: ci===0 ? 'left' : 'right', wrapText: ci===0};
        }
        cell.border = borderAll;
        if(isSectionHeader && ci===0){ cell.font = {bold:true, size:10.5, color:{argb:'FF1F2937'}}; }
        if(isTotalRow){
          cell.font = Object.assign({}, cell.font, {bold:true});
          cell.border = Object.assign({}, borderAll, {top:{style:'medium', color:{argb:'FF1F2937'}}});
        }
      });
    }
  });

  const colWidths = [];
  rows.forEach(r=> r.forEach((cell,i)=>{ const len = (cell==null?'':String(cell)).length; colWidths[i] = Math.max(colWidths[i]||10, Math.min(len+3, 44)); }));
  for(let i=0;i<maxCols;i++){ ws.getColumn(i+1).width = colWidths[i]||14; }
  if(maxCols>0) ws.getColumn(1).width = Math.max(ws.getColumn(1).width, 24);

  ws.views = [{ state:'frozen', ySplit: bodyStartRow + (headerRowIdx>=0 ? headerRowIdx+1 : 3), xSplit:0 }];
  return ws;
}
async function saveWorkbook(wb, filename){
  const buf = await wb.xlsx.writeBuffer();
  const blob = new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
async function downloadXLSX(filename, rows, sheetName){
  if(typeof ExcelJS==='undefined'){ toast('Excel export needs an internet connection to load the Excel library'); return; }
  try{
    const wb = new ExcelJS.Workbook();
    wb.creator = state.meta.companyName || 'Company';
    wb.created = new Date();
    addStatementSheet(wb, rows, sheetName);
    await saveWorkbook(wb, filename);
    toast('Excel file downloaded');
  }catch(err){
    console.error(err);
    toast('Excel export failed — see console for details');
  }
}

/* ============================= EXPORT RANGE & FORMAT CONTROLS ============================= */
// Shared "as at / for the period" export controls used across every statement's export bar.
// Choosing "Custom Range" here does NOT change the books' Period Start/End in Settings — it
// only affects what gets pulled into that particular download. withDateRange() achieves this
// by briefly swapping state.meta.periodStart/periodEnd around the existing compute functions
// (which already read those two fields everywhere), then restoring them immediately after —
// this reuses all the existing statement logic unmodified rather than threading date params
// through every compute*() function individually.
let exportRangeMode = 'current'; // 'current' | 'custom'
let exportCustomFrom = null, exportCustomTo = null;
let comparePL = false, compareSFP = false, showSFPGroupTotals = true;
function priorRange(start, end){
  const s = new Date(start+'T00:00:00'), e = new Date(end+'T00:00:00');
  const daysLen = Math.round((e-s)/86400000)+1;
  const priorEnd = new Date(s); priorEnd.setDate(priorEnd.getDate()-1);
  const priorStart = new Date(priorEnd); priorStart.setDate(priorStart.getDate()-daysLen+1);
  const iso = d=>d.toISOString().slice(0,10);
  return {start: iso(priorStart), end: iso(priorEnd)};
}
function getExportRange(){
  if(exportRangeMode==='custom'){
    return {start: exportCustomFrom || state.meta.periodStart, end: exportCustomTo || state.meta.periodEnd};
  }
  return {start: state.meta.periodStart, end: state.meta.periodEnd};
}
function withDateRange(start, end, fn){
  const origStart = state.meta.periodStart, origEnd = state.meta.periodEnd;
  state.meta.periodStart = start; state.meta.periodEnd = end;
  try { return fn(); } finally { state.meta.periodStart = origStart; state.meta.periodEnd = origEnd; }
}
function renderExportBar(csvFn, xlsxFn, extraButtonsHtml, currentLabel){
  const cur = exportRangeMode==='current';
  return `
  <div class="export-bar no-print" style="align-items:center;">
    ${extraButtonsHtml||''}
    <label style="display:flex;align-items:center;gap:5px;font-size:12px;color:var(--slate);cursor:pointer;">
      <input type="radio" name="exp-range-mode" ${cur?'checked':''} onchange="exportRangeMode='current';render();"> ${currentLabel || 'Current Period'}
    </label>
    <label style="display:flex;align-items:center;gap:5px;font-size:12px;color:var(--slate);cursor:pointer;">
      <input type="radio" name="exp-range-mode" ${!cur?'checked':''} onchange="exportRangeMode='custom';render();"> Custom Range
    </label>
    ${!cur ? `
      <input type="date" value="${exportCustomFrom||state.meta.periodStart}" onchange="exportCustomFrom=this.value;" style="padding:5px 7px;font-size:12px;border:1px solid var(--rule-strong);border-radius:4px;background:var(--surface);color:var(--ink);">
      <span style="color:var(--slate);font-size:12px;">to</span>
      <input type="date" value="${exportCustomTo||state.meta.periodEnd}" onchange="exportCustomTo=this.value;" style="padding:5px 7px;font-size:12px;border:1px solid var(--rule-strong);border-radius:4px;background:var(--surface);color:var(--ink);">
    ` : ''}
    <span style="width:1px;align-self:stretch;background:var(--rule);margin:0 4px;"></span>
    <button class="btn secondary" onclick="${csvFn}()">⬇ CSV</button>
    <button class="btn secondary" onclick="${xlsxFn}()">⬇ Excel</button>
    <button class="btn secondary" onclick="exportPrint()">🖶 Print / PDF</button>
  </div>`;
}
// Generic print/PDF export: if a custom range is selected, temporarily re-renders the current
// tab using that range, opens the print dialog, then restores the normal view once printing
// is done (or cancelled) via the 'afterprint' event.
function exportPrint(){
  const {start,end} = getExportRange();
  if(start===state.meta.periodStart && end===state.meta.periodEnd){ window.print(); return; }
  const origStart = state.meta.periodStart, origEnd = state.meta.periodEnd;
  state.meta.periodStart = start; state.meta.periodEnd = end;
  render();
  const restore = ()=>{
    state.meta.periodStart = origStart; state.meta.periodEnd = origEnd;
    render();
    window.removeEventListener('afterprint', restore);
  };
  window.addEventListener('afterprint', restore);
  setTimeout(()=>{ window.print(); }, 60);
}

// Pushes ledger rows for export, grouped by Chart of Accounts group with a
// "Total <Group Name>" row after each group — mirrors sfpLineRows, but as
// plain [label, amount] pairs for CSV/XLSX. Falls back to a flat list when
// group totals are switched off.
function pushSFPExportRows(rows, signFn, target){
  if(!showSFPGroupTotals){
    rows.filter(r=>Math.abs(signFn(r))>0.004).forEach(r=>target.push([r.ledger.name, signFn(r).toFixed(2)]));
    return;
  }
  groupedByChartGroup(rows).forEach(g=>{
    const filtered = g.rows.filter(r=>Math.abs(signFn(r))>0.004);
    if(!filtered.length) return;
    filtered.forEach(r=>target.push([r.ledger.name, signFn(r).toFixed(2)]));
    const total = filtered.reduce((s,r)=>s+signFn(r),0);
    target.push(['Total '+g.name, total.toFixed(2)]);
  });
}

  rows.push(['Current Assets']);

  rows.push(['Total Current Assets', (s.totalCA+s.totalCash).toFixed(2)]); rows.push([]);
  rows.push(['Total Assets', s.totalAssets.toFixed(2)]); rows.push([]);
  rows.push(['EQUITY & LIABILITIES']);

  rows.push(['Working Capital', r.workingCapital.toFixed(2)]);
  rows.push([]);
  rows.push(['Profitability Ratios']);
  rows.push(['Gross Profit Margin', r.grossMargin!=null?(r.grossMargin*100).toFixed(1)+'%':'n/a']);
  rows.push(['Net Profit Margin', r.netMargin!=null?(r.netMargin*100).toFixed(1)+'%':'n/a']);
  rows.push(['Return on Assets (ROA)', r.roa!=null?(r.roa*100).toFixed(1)+'%':'n/a']);
  rows.push(['Return on Equity (ROE)', r.roe!=null?(r.roe*100).toFixed(1)+'%':'n/a']);
  rows.push([]);
  rows.push(['Efficiency & Activity Ratios']);
  rows.push(['Asset Turnover', r.assetTurnover!=null? r.assetTurnover.toFixed(2)+'x':'n/a']);
  rows.push(['Inventory Turnover', r.inventoryTurnover!=null? r.inventoryTurnover.toFixed(2)+'x':'n/a']);
  rows.push(['Receivable Days (DSO)', r.receivableDays!=null? Math.round(r.receivableDays)+' days':'n/a']);
  rows.push(['Payable Days (DPO)', r.payableDays!=null? Math.round(r.payableDays)+' days':'n/a']);
  rows.push([]);
  rows.push(['Leverage & Solvency Ratios']);
  rows.push(['Debt to Equity', r.debtToEquity!=null? r.debtToEquity.toFixed(2)+'x':'n/a']);
  rows.push(['Debt to Assets', r.debtToAssets!=null? r.debtToAssets.toFixed(2)+'x':'n/a']);
  rows.push(['Interest Coverage Ratio', r.interestCoverage!=null? r.interestCoverage.toFixed(2)+'x':'n/a']);
  rows.push([]);
  rows.push(['Cash Flow Ratios']);
  rows.push(['Operating Cash Flow Ratio', r.operatingCFRatio!=null? r.operatingCFRatio.toFixed(2)+'x':'n/a']);
  rows.push(['Cash Flow to Net Income', r.cfToNetIncome!=null? r.cfToNetIncome.toFixed(2)+'x':'n/a']);
  return rows;
}
function exportRatiosCSV(){
  const {start,end} = getExportRange();
  const rows = withDateRange(start,end,ratiosRows);
  downloadCSV(`Ratio_Analysis_${safeFileTag()}_${end}.csv`, rows);
}
function exportRatiosXLSX(){
  const {start,end} = getExportRange();
  const rows = withDateRange(start,end,ratiosRows);
  downloadXLSX(`Ratio_Analysis_${safeFileTag()}_${end}.xlsx`, rows, 'Ratio Analysis');
}
