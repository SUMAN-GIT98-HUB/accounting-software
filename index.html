<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger — Books &amp; Statements</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0B1220;
  --ink-2:#161F35;
  --ink-soft:#1E2A47;
  --paper:#EEF1F6;
  --surface:#FFFFFF;
  --surface-2:#F6F8FB;
  --rule:#E2E7F0;
  --rule-strong:#CBD3E3;
  --brass:#B7791F;
  --brass-dark:#8C5A12;
  --brass-soft:#FBF0DA;
  --slate:#57607A;
  --slate-light:#8891A8;
  --green:#157A45;
  --green-soft:#E4F5EC;
  --red:#BC2626;
  --red-soft:#FBEAEA;
  --blue:#2C4EA6;
  --blue-soft:#E8EDFB;
  --focus:#3B63D9;
  --shadow-sm:0 1px 2px rgba(11,18,32,.06);
  --shadow-md:0 8px 24px rgba(11,18,32,.10), 0 2px 6px rgba(11,18,32,.06);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Inter',sans-serif;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:'Manrope',sans-serif;font-weight:700;margin:0 0 4px;color:var(--ink);letter-spacing:-.02em;}
.num{font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:14px;}
:focus-visible{outline:2px solid var(--focus);outline-offset:1px;}
svg{display:block;}

/* Layout */
#shell{display:flex;min-height:100vh;}
#sidebar{
  width:230px;flex-shrink:0;background:var(--ink);color:#C7D0E4;
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
  background-image:linear-gradient(180deg, var(--ink-soft) 0%, var(--ink) 62%);
  box-shadow:1px 0 0 rgba(0,0,0,.06), 6px 0 28px rgba(5,9,18,.18);
}
#brand{padding:22px 20px 18px;border-bottom:1px solid rgba(255,255,255,.09);display:flex;align-items:center;gap:10px;}
#brand .mark{width:34px;height:34px;flex-shrink:0;border:1.5px solid var(--brass);border-radius:7px;display:flex;align-items:center;justify-content:center;font-family:'Manrope',sans-serif;font-weight:800;color:var(--brass);font-size:16px;background:rgba(183,121,31,.12);overflow:hidden;}
#brand .mark.has-logo{background:#fff;}
#brand .mark img{width:100%;height:100%;object-fit:contain;padding:3px;}
#brand .brand-text{min-width:0;}
#brand .co{font-family:'Manrope',sans-serif;font-size:15px;color:#fff;font-weight:700;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em;}
#brand .period{font-size:10.5px;color:#7C89AA;margin-top:3px;font-family:'IBM Plex Mono',monospace;}
nav{padding:14px 10px;flex:1;overflow-y:auto;}
nav .nav-section + .nav-section{margin-top:18px;}
nav .grp-label{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:#6B7796;margin:0 10px 6px;font-weight:600;}
nav button.tab{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;
  color:#B4BEDA;padding:8px 10px;border-radius:6px;font-size:13px;margin-bottom:2px;transition:background .12s, color .12s;
}
nav button.tab .nav-icon{width:16px;height:16px;flex-shrink:0;color:#7883A6;transition:color .12s;}
nav button.tab:hover{background:rgba(255,255,255,.06);color:#fff;}
nav button.tab:hover .nav-icon{color:#CBD3EA;}
nav button.tab.active{background:linear-gradient(90deg, rgba(183,121,31,.24), rgba(183,121,31,.07));color:#fff;box-shadow:inset 3px 0 0 var(--brass);font-weight:600;}
nav button.tab.active .nav-icon{color:var(--brass);}
#sidebar-foot{padding:12px 20px 16px;font-size:10.5px;color:#66739A;border-top:1px solid rgba(255,255,255,.09);}

#main{flex:1;min-width:0;display:flex;flex-direction:column;}
#topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px 40px;background:rgba(238,241,246,.85);backdrop-filter:blur(6px);border-bottom:1px solid var(--rule);}
#topbar .spacer{flex:1;}
#topbar .period-pill{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--slate);background:var(--surface);border:1px solid var(--rule);padding:5px 11px;border-radius:20px;white-space:nowrap;}
#main-inner{flex:1;padding:26px 40px 60px;max-width:1220px;width:100%;}
.pagehead{margin-bottom:22px;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px;}
.pagehead .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--brass-dark);font-weight:600;margin-bottom:4px;}
.pagehead h1{font-size:23px;}
.pagehead p.sub{color:var(--slate);margin:5px 0 0;max-width:60ch;font-size:13px;}

/* Cards / sheets */
.sheet{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:22px 24px;margin-bottom:20px;position:relative;box-shadow:var(--shadow-sm);}
.sheet::before{content:'';position:absolute;left:0;top:16px;bottom:16px;width:3px;border-radius:0 3px 3px 0;background:var(--rule-strong);opacity:.5;}
.sheet.tight{padding:16px 20px;}
.sheet.spine-brass::before{background:var(--brass);opacity:1;}
.sheet.spine-blue::before{background:var(--blue);opacity:1;}
.sheet.spine-green::before{background:var(--green);opacity:1;}
.sheet.spine-red::before{background:var(--red);opacity:1;}
.card-title{font-family:'Manrope',sans-serif;font-size:14.5px;font-weight:700;letter-spacing:-.01em;margin:0 0 14px;padding-bottom:10px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;align-items:center;gap:8px;}
.card-title .card-icon{width:17px;height:17px;color:var(--brass-dark);flex-shrink:0;}
.card-title-row{display:flex;align-items:center;gap:8px;}

/* Buttons */
.btn{border:1px solid var(--ink);background:var(--ink);color:#fff;padding:7px 14px;border-radius:6px;font-size:12.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px;transition:background .12s,box-shadow .12s;}
.btn:hover{background:var(--ink-2);}
.btn.secondary{background:var(--surface);color:var(--ink);border-color:var(--rule-strong);}
.btn.secondary:hover{background:#E7ECF5;}
.btn.brass{background:var(--brass);border-color:var(--brass);}
.btn.brass:hover{background:var(--brass-dark);}
.btn.danger{background:transparent;color:var(--red);border-color:var(--red);}
.btn.danger:hover{background:var(--red-soft);}
.btn.small{padding:4px 9px;font-size:11.5px;border-radius:5px;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn .btn-icon{width:13px;height:13px;}

/* Forms */
label{display:block;font-size:11.5px;color:var(--slate);margin-bottom:4px;font-weight:500;}
input[type=text],input[type=date],input[type=number],input[type=email],input[type=password],select,textarea{
  width:100%;padding:7px 9px;border:1px solid var(--rule-strong);border-radius:6px;background:#fff;color:var(--ink);
}
input:focus,select:focus,textarea:focus{border-color:var(--focus);}
textarea{resize:vertical;min-height:44px;}
.field{margin-bottom:12px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.row3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px;}

/* Tables */
table{width:100%;border-collapse:collapse;}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--slate);padding:6px 8px;border-bottom:1.5px solid var(--ink);font-weight:600;}
td{padding:8px 8px;border-bottom:1px solid var(--rule);font-size:13px;vertical-align:top;}
tr:last-child td{border-bottom:1px solid var(--rule);}
td.num,th.num{text-align:right;}
tr.total td{border-top:1.5px solid var(--ink);border-bottom:3px double var(--ink);font-weight:600;padding-top:9px;padding-bottom:9px;}
tr.subtotal td{border-top:1px solid var(--rule-strong);font-weight:600;}
tr.chart-group-total td{border-top:1px dashed var(--rule-strong);font-weight:600;font-style:italic;color:var(--slate);padding-top:6px;padding-bottom:6px;}
tr.group-row td{padding-top:14px;font-weight:700;color:var(--brass-dark);font-family:'Manrope',sans-serif;font-size:13px;letter-spacing:-.005em;border-bottom:1px solid var(--rule-strong);}
tr.col-head td{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--slate);font-weight:600;padding-bottom:6px;}
tr:hover td{background:var(--surface-2);}
.empty{color:var(--slate-light);font-style:italic;padding:20px 8px;text-align:center;}
.tag{display:inline-block;font-size:10px;padding:2px 8px;border-radius:10px;background:var(--brass-soft);color:var(--brass-dark);font-weight:600;letter-spacing:.02em;}
.tag.dr{background:var(--blue-soft);color:var(--blue);}
.tag.cr{background:var(--red-soft);color:var(--red);}
.tag.vt-payment{background:var(--red-soft);color:var(--red);}
.tag.vt-receipt{background:var(--green-soft);color:var(--green);}
.tag.vt-contra{background:var(--blue-soft);color:var(--blue);}
.tag.vt-sales{background:var(--green-soft);color:var(--green);}
.tag.vt-purchase{background:var(--red-soft);color:var(--red);}
.tag.vt-journal{background:var(--brass-soft);color:var(--brass-dark);}
.pos{color:var(--green);}
.neg{color:var(--red);}
.muted{color:var(--slate-light);}
.hint{font-size:11.5px;color:var(--slate-light);margin-top:4px;}
.actions-cell{white-space:nowrap;text-align:right;}
.badge-ok{color:var(--green);font-weight:600;}
.badge-bad{color:var(--red);font-weight:600;}
.toast{position:fixed;bottom:20px;right:20px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;box-shadow:0 10px 30px rgba(11,18,32,.35);z-index:999;opacity:0;transform:translateY(6px);transition:.25s;pointer-events:none;}
.toast.show{opacity:1;transform:translateY(0);}
.search-wrap{position:relative;flex:1;max-width:420px;}
.search-wrap input{width:100%;background:var(--surface);border:1px solid var(--rule);color:var(--ink);font-size:13px;padding:7px 12px 7px 30px;border-radius:20px;outline:none;}
.search-wrap input:focus{border-color:var(--brass);}
.search-wrap .search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--slate);pointer-events:none;width:14px;height:14px;}
.search-dropdown{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--rule);border-radius:10px;box-shadow:var(--shadow-md);max-height:70vh;overflow-y:auto;z-index:150;}
.search-dropdown .sr-group-label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--brass-dark);font-weight:600;padding:10px 14px 4px;}
.search-dropdown .sr-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 14px;cursor:pointer;border-top:1px solid var(--rule);}
.search-dropdown .sr-item:first-child, .search-dropdown .sr-group-label + .sr-item{border-top:none;}
.search-dropdown .sr-item:hover{background:var(--paper);}
.search-dropdown .sr-item .sr-main{min-width:0;}
.search-dropdown .sr-item .sr-title{font-size:13px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.search-dropdown .sr-item .sr-sub{font-size:11.5px;color:var(--slate);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.search-dropdown .sr-item .sr-amt{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--slate);flex-shrink:0;}
.search-dropdown .sr-empty{padding:16px 14px;font-size:13px;color:var(--slate);text-align:center;}
.search-dropdown .sr-more{padding:7px 14px;font-size:11.5px;color:var(--slate);border-top:1px solid var(--rule);}
@media(max-width:860px){ .search-wrap{max-width:none;} }
.modal-backdrop{position:fixed;inset:0;background:rgba(11,18,32,.5);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;}
.modal-box{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:24px 26px;max-width:420px;width:100%;box-shadow:var(--shadow-md);}
.modal-box .card-title{display:flex;justify-content:space-between;align-items:center;}
.jline{display:grid;grid-template-columns:2.3fr 1fr 1fr auto;gap:8px;margin-bottom:6px;align-items:center;}
.jline .rm{background:none;border:none;color:var(--slate-light);font-size:16px;padding:4px 6px;}
.jline .rm:hover{color:var(--red);}
.jline-wrap{margin-bottom:2px;}
.jline-fx{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:2px 0 10px;padding:8px 10px;background:var(--brass-soft);border-radius:6px;font-size:12.5px;}
.jline-fx select, .jline-fx input{font-size:12.5px;padding:5px 7px;}
.jline-fx .fx-badge{font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--brass-dark);flex-shrink:0;}
.jline-fx .fx-at{color:var(--slate);}
.jline-fx .fx-eq{margin-left:auto;font-family:'IBM Plex Mono',monospace;color:var(--ink);font-weight:600;}
.jtotals{display:flex;justify-content:flex-end;gap:26px;margin-top:10px;padding-top:10px;border-top:1px solid var(--rule);font-family:'IBM Plex Mono',monospace;font-size:13px;}
.jtotals .lbl{color:var(--slate);margin-right:6px;font-family:'Inter',sans-serif;}
.balance-flag{font-weight:600;}
.grid-cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
@media(max-width:980px){.grid-cols{grid-template-columns:1fr;}}
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
@media(max-width:900px){.kpi-row{grid-template-columns:repeat(2,1fr);}}
.kpi{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:15px 17px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden;}
.kpi::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;}
.kpi.spine-ink::before{background:var(--ink);}
.kpi.spine-blue::before{background:var(--blue);}
.kpi.spine-green::before{background:var(--green);}
.kpi.spine-brass::before{background:var(--brass);}
.kpi .k-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.kpi .k-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--slate);}
.kpi .k-icon{width:16px;height:16px;color:var(--slate-light);}
.kpi .k-val{font-family:'IBM Plex Mono',monospace;font-size:21px;font-weight:600;}
.kpi .k-sub{font-size:11px;color:var(--slate-light);margin-top:4px;}
.entry-block{border:1px solid var(--rule);border-radius:8px;margin-bottom:10px;overflow:hidden;}
.entry-head{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;background:var(--surface-2);cursor:pointer;}
.entry-head .vno{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--brass-dark);font-weight:600;}
.entry-head .date{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--slate);}
.entry-body{padding:10px 14px;display:none;}
.entry-body.open{display:block;}
.entry-body .narr{font-size:12.5px;color:var(--slate);font-style:italic;margin-bottom:8px;}
#toolbar-inline{display:flex;gap:8px;flex-wrap:wrap;}
.mobile-toggle{display:none;}
.activity-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--rule);font-size:13px;}
.activity-row:last-child{border-bottom:none;}
.activity-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.activity-row .a-narr{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.checklist{list-style:none;margin:0;padding:0;}
.checklist li{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--rule);font-size:13px;color:var(--slate);align-items:flex-start;}
.checklist li:last-child{border-bottom:none;}
.checklist .cl-num{width:20px;height:20px;border-radius:50%;background:var(--brass-soft);color:var(--brass-dark);font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}
.chart-legend{display:flex;gap:16px;font-size:11.5px;color:var(--slate);margin-bottom:10px;}
.chart-legend .lg{display:inline-flex;align-items:center;gap:5px;}
.chart-legend .sw{width:9px;height:9px;border-radius:2px;}
@media(max-width:860px){
  #sidebar{position:fixed;left:-240px;transition:left .2s;z-index:50;box-shadow:4px 0 24px rgba(0,0,0,.35);}
  #sidebar.open{left:0;}
  #topbar{padding:12px 16px;}
  #main-inner{padding:18px 16px 60px;}
  .mobile-toggle{display:inline-flex;}
  .row2,.row3{grid-template-columns:1fr;}
}
select[multiple]{height:auto;}
.export-bar{display:flex;gap:8px;flex-wrap:wrap;}
@media print{
  #sidebar, #topbar, .mobile-toggle, .no-print{display:none !important;}
  #main-inner{padding:0 !important;max-width:100% !important;}
  body{background:#fff !important;}
  .sheet{border:none !important;box-shadow:none !important;padding:0 !important;margin-bottom:18px !important;page-break-inside:avoid;}
  .sheet::before{display:none !important;}
  .grid-cols{display:block !important;}
  .grid-cols .sheet{margin-bottom:22px !important;}
  .pagehead{margin-bottom:14px;}
  tr.total td{border-bottom:3px double #000;}
  .entry-body{display:block !important;}
  .entry-head{cursor:default;}
  .letterhead{margin-bottom:14px;padding-bottom:10px;}
  body.printing-all .print-statement-block{page-break-after:always;}
  body.printing-all .print-statement-block:last-child{page-break-after:auto;}
}
.letterhead{display:flex;align-items:center;gap:14px;padding-bottom:16px;margin-bottom:20px;border-bottom:2px solid var(--rule-strong);page-break-inside:avoid;}
.letterhead-logo{max-height:58px;max-width:170px;object-fit:contain;flex-shrink:0;}
.letterhead-text{flex:1;min-width:0;}
.letterhead-name{font-family:'Manrope',sans-serif;font-size:17px;font-weight:700;color:var(--ink);letter-spacing:-.01em;}
.letterhead-line{font-size:12px;color:var(--slate);margin-top:3px;white-space:pre-line;line-height:1.45;}
.logo-preview-wrap{display:flex;align-items:center;gap:12px;margin-top:6px;}
.logo-preview{max-height:56px;max-width:160px;object-fit:contain;border:1px solid var(--rule);border-radius:6px;padding:6px;background:var(--surface);}
.logo-preview-empty{font-size:12px;color:var(--slate-light);border:1px dashed var(--rule-strong);border-radius:6px;padding:14px 18px;}
#auth-screen{min-height:100vh;align-items:center;justify-content:center;background:var(--ink);background-image:radial-gradient(1100px 620px at 12% -10%, rgba(183,121,31,.18), transparent 60%), linear-gradient(180deg, var(--ink-soft) 0%, var(--ink) 62%);padding:20px;}
.auth-wrap{width:100%;max-width:840px;display:flex;background:var(--surface);border-radius:16px;overflow:hidden;box-shadow:var(--shadow-md), 0 24px 60px rgba(11,18,32,.35);}
.auth-brand-panel{flex:1 1 340px;background:var(--ink);background-image:radial-gradient(620px 420px at 100% 0%, rgba(183,121,31,.22), transparent 60%), linear-gradient(165deg, var(--ink-soft) 0%, var(--ink) 100%);color:#fff;padding:40px 36px;display:flex;flex-direction:column;justify-content:space-between;}
.auth-logo{display:flex;align-items:center;gap:10px;}
.auth-logo .mark-sq{width:38px;height:38px;border-radius:9px;background:rgba(183,121,31,.18);border:1.5px solid var(--brass);display:flex;align-items:center;justify-content:center;font-family:'Manrope',sans-serif;font-weight:800;color:var(--brass);font-size:16px;flex-shrink:0;}
.auth-logo .wordmark{font-family:'Manrope',sans-serif;font-weight:800;font-size:19px;letter-spacing:-.01em;}
.auth-brand-panel .wordmark{color:#fff;}
.auth-brand-panel h2{font-family:'Manrope',sans-serif;font-size:23px;line-height:1.35;margin:30px 0 12px;color:#fff;font-weight:700;letter-spacing:-.01em;}
.auth-brand-panel p.tagline{color:#B7C0D6;font-size:13px;line-height:1.6;margin:0 0 26px;}
.auth-feature-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;}
.auth-feature-list li{display:flex;align-items:flex-start;gap:10px;font-size:12.5px;color:#D7DCEA;line-height:1.4;}
.auth-feature-list .dot{width:6px;height:6px;border-radius:50%;background:var(--brass);margin-top:5px;flex-shrink:0;}
.auth-brand-panel .auth-foot{font-size:11px;color:#7C879E;margin-top:28px;}
.auth-form-panel{flex:1 1 320px;padding:44px 40px;display:flex;flex-direction:column;justify-content:center;}
.auth-form-panel .mobile-logo{display:none;align-items:center;gap:8px;margin-bottom:24px;}
.auth-form-panel .mobile-logo .mark-sq{width:32px;height:32px;border-radius:8px;background:var(--brass-soft);border:1.5px solid var(--brass);display:flex;align-items:center;justify-content:center;font-family:'Manrope',sans-serif;font-weight:800;color:var(--brass);font-size:13px;}

/* ============================= CLOUD / AUTH ============================= */


let pushTimer = null;


/* Pull the user's companies from Supabase into the localStorage cache, or push
   whatever's already on this device up as their first company if the account is new. */
async function cloudSync(){
  const { data: rows, error } = await sb.from('companies').select('id,name,data');
  if(error){ toast('Cloud sync failed: '+error.message); return; }
  if(rows && rows.length){
    const registry = rows.map(r=>({id:r.id, name:r.name}));
    rows.forEach(r=>{ localStorage.setItem(companyStateKey(r.id), JSON.stringify(r.data)); });
    saveCompanyRegistry(registry);
    let activeId = localStorage.getItem(ACTIVE_COMPANY_KEY);
    if(!activeId || !registry.some(c=>c.id===activeId)) activeId = registry[0].id;
    localStorage.setItem(ACTIVE_COMPANY_KEY, activeId);
  } else {
    // New account with nothing in the cloud yet — push up whatever is on this device.
    const companies = listCompanies();
    for(const c of companies){
      const raw = localStorage.getItem(companyStateKey(c.id));
      if(raw) await cloudPushCompany(c.id, c.name, JSON.parse(raw));
    }
  }
}
async function cloudPushCompany(id, name, data){
  const { error } = await sb.from('companies').upsert({ id, name, data });
  if(error) console.error('Cloud push failed', error);
}
async function cloudDeleteCompany(id){
  const { error } = await sb.from('companies').delete().eq('id', id);
  if(error) console.error('Cloud delete failed', error);
}
function schedulePush(){
  clearTimeout(pushTimer);
  pushTimer = setTimeout(()=>{ cloudPushCompany(activeCompanyId, state.meta.companyName, state); }, 800);
}

}

/* ============================= MULTI-COMPANY ============================= */
function switchCompany(id){
  if(id===activeCompanyId) return;
  const companies = listCompanies();
  const co = companies.find(c=>c.id===id);
  if(!co){ toast('Company not found'); return; }
  activeCompanyId = id;
  try{ localStorage.setItem(ACTIVE_COMPANY_KEY, id); }catch(e){}
  const raw = localStorage.getItem(companyStateKey(id));
  state = raw ? JSON.parse(raw) : defaultState();
  migrateState();
  activeTab = 'dashboard';
  editingEntryId = null; editingCompanyId = null;
  jLines = [ {ledgerId:'', debit:'', credit:'', fxAmount:'', fxRate:'', fxSide:'debit'}, {ledgerId:'', debit:'', credit:'', fxAmount:'', fxRate:'', fxSide:'debit'} ];
  jNewLedgerLineIndex = null; jVoucherType = 'Journal';
  render();
  toast('Switched to "'+co.name+'"');
}
function createCompany(name){
  name = (name||'').trim();
  if(!name){ toast('Company name is required'); return; }
  const id = uid('co');
  const st = defaultState();
  st.meta.companyName = name;
  try{ localStorage.setItem(companyStateKey(id), JSON.stringify(st)); }catch(e){}
  const companies = listCompanies();
  companies.push({id, name});
  saveCompanyRegistry(companies);
  cloudPushCompany(id, name, st);
  switchCompany(id);
}
function deleteCompany(id){
  const companies = listCompanies();
  if(companies.length<=1){ toast('Cannot delete the only company'); return; }
  const co = companies.find(c=>c.id===id);
  if(!co) return;
  if(!confirm('Delete "'+co.name+'" and all of its ledgers, entries, and settings? This cannot be undone.')) return;
  try{ localStorage.removeItem(companyStateKey(id)); }catch(e){}
  const remaining = companies.filter(c=>c.id!==id);
  saveCompanyRegistry(remaining);
  cloudDeleteCompany(id);
  if(activeCompanyId===id){ switchCompany(remaining[0].id); }
  else { render(); }
  toast('Company deleted');
}
function startNewCompany(){
  editingCompanyId = 'NEW'; render();
  setTimeout(()=>{ const el=document.getElementById('co-name'); if(el) el.focus(); }, 0);
}
function confirmNewCompany(){
  const name = document.getElementById('co-name').value.trim();
  if(!name){ toast('Company name is required'); return; }
  editingCompanyId = null;
  createCompany(name);
}
function confirmRenameCompany(id){
  const name = document.getElementById('co-name').value.trim();
  if(!name){ toast('Company name is required'); return; }
  const companies = listCompanies();
  const c = companies.find(x=>x.id===id);
  if(c) c.name = name;
  saveCompanyRegistry(companies);
  if(id===activeCompanyId){
    state.meta.companyName = name; persist();
  } else {
    try{
      const raw = localStorage.getItem(companyStateKey(id));
      if(raw){
        const st = JSON.parse(raw); st.meta.companyName = name; localStorage.setItem(companyStateKey(id), JSON.stringify(st));
        cloudPushCompany(id, name, st);
      }
    }catch(e){}
  }
  editingCompanyId = null;
  render();
  toast('Company renamed');
}

/* ============================= IMPORT TRIAL BALANCE ============================= */
// Lets a user with an existing trial balance (CSV or XLSX) skip manual journal entry
// entirely: each imported ledger's Debit/Credit becomes that ledger's Opening Balance as
// of the books' Period Start. With no entries posted during the period, opening = closing,
// so Trial Balance / P&L / SFP / SCE / SCF all compute directly from the imported figures.
let tbImportModalOpen = false;
let tbImportStep = 'upload'; // 'upload' | 'review'
let tbImportRows = []; // [{name, debit, credit, matchLedgerId, newGroupId, include}]
let tbImportWarning = '';

function openTBImportModal(){
  tbImportModalOpen = true; tbImportStep = 'upload'; tbImportRows = []; tbImportWarning = '';
  renderModal();
}
function closeTBImportModal(){
  tbImportModalOpen = false;
  renderModal();
}
function downloadTBImportTemplate(){
  const rows = [
    ['Ledger','Group','Debit','Credit'],
    ['Cash in Hand','Cash & Bank','25000.00',''],
    ['Bank Account','Cash & Bank','480000.00',''],
    ['Trade Receivables','Trade Receivables','150000.00',''],
    ['Share Capital','Share Capital','','500000.00'],
    ['Sales','Sales / Revenue','','620000.00'],
    ['Purchases','Cost of Sales','300000.00',''],
    ['Salary Expense','Operating Expenses','165000.00',''],
  ];
  downloadCSV('Trial_Balance_Import_Template.csv', rows);
}
function csvParseText(text){
  // Minimal RFC4180-ish CSV parser: handles quoted fields, escaped quotes, and commas inside quotes.
  const rows = []; let row = []; let field = ''; let inQuotes = false;
  for(let i=0;i<text.length;i++){
    const ch = text[i];
    if(inQuotes){
      if(ch==='"'){ if(text[i+1]==='"'){ field+='"'; i++; } else { inQuotes=false; } }
      else field += ch;
    } else {
      if(ch==='"') inQuotes = true;
      else if(ch===','){ row.push(field); field=''; }
      else if(ch==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else if(ch==='\r'){ /* skip, \n handles the break */ }
      else field += ch;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r=> r.some(c=>String(c).trim()!==''));
}
function guessGroupForName(name){
  const n = (name||'').toLowerCase();
  const byNameKeyword = (re) => state.groups.find(g=> re.test((g.name||'').toLowerCase()));
  const find = (pred) => state.groups.find(pred);
  const rules = [
    {test:/cash|petty/, nameRe:/cash/, fallback:g=>g.isCash},
    {test:/bank/, nameRe:/bank/, fallback:g=>g.isCash},
    {test:/receivable|debtor/, nameRe:/receivable|debtor/, fallback:g=>g.nature==='Asset' && g.subCategory==='Current' && !g.isCash},
    {test:/payable|creditor/, nameRe:/payable|creditor/, fallback:g=>g.nature==='Liability' && g.subCategory==='Current'},
    {test:/capital|share/, nameRe:/capital|share/, fallback:g=>g.nature==='Equity'},
    {test:/retained|reserve/, nameRe:/retained|reserve/, fallback:g=>g.nature==='Equity'},
    {test:/sale|revenue|income/, nameRe:/sale|revenue/, fallback:g=>g.nature==='Income' && g.subCategory==='Direct'},
    {test:/purchase|cost of (goods|sales)/, nameRe:/purchase|cost of (goods|sales)/, fallback:g=>g.nature==='Expense' && g.subCategory==='Direct'},
    {test:/depreciation|salary|rent|expense|utilit|admin/, nameRe:/expense|operating/, fallback:g=>g.nature==='Expense' && g.subCategory==='Indirect'},
    {test:/inventory|stock/, nameRe:/inventory|stock/, fallback:g=>g.nature==='Asset' && g.subCategory==='Current' && !g.isCash},
    {test:/loan|liabilit/, nameRe:/loan|liabilit/, fallback:g=>g.nature==='Liability'},
    {test:/fixed asset|property|plant|equipment|furniture|vehicle/, nameRe:/fixed asset|property|plant|equipment/, fallback:g=>g.nature==='Asset' && g.subCategory==='Non-Current'},
  ];
  for(const rule of rules){
    if(rule.test.test(n)) return byNameKeyword(rule.nameRe) || find(rule.fallback);
  }
  return null;
}
function parseNum(v){
  if(v==null) return 0;
  const s = String(v).replace(/[,\s]/g,'').replace(/^\((.*)\)$/,'-$1').replace(/[^\d.\-]/g,'');
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}
function buildTBImportRows(aoa){
  if(!aoa.length){ tbImportWarning = 'No rows found in the file.'; return; }
  const header = aoa[0].map(h=>String(h||'').trim().toLowerCase());
  const findCol = (...cands) => header.findIndex(h=> cands.some(c=> h===c || h.includes(c)));
  const nameIdx = findCol('ledger','account','particulars','name');
  const groupIdx = findCol('group','category');
  const debitIdx = findCol('debit','dr');
  const creditIdx = findCol('credit','cr');
  const amountIdx = findCol('amount','balance');
  const typeIdx = findCol('type','dr/cr','drcr');
  if(nameIdx<0){ tbImportWarning = 'Could not find a "Ledger" / "Account" column in the file header.'; tbImportRows=[]; return; }
  const dataRows = aoa.slice(1);
  const hasDebitCredit = debitIdx>=0 || creditIdx>=0;
  if(!hasDebitCredit && amountIdx<0){ tbImportWarning = 'Could not find Debit/Credit columns (or an Amount column) in the file header.'; tbImportRows=[]; return; }
  if(!hasDebitCredit) tbImportWarning = 'Only an "Amount" column was found — positive treated as Debit, negative as Credit. Please check each row below.';

  tbImportRows = dataRows.map(r=>{
    const name = String(r[nameIdx]||'').trim();
    let debit = 0, credit = 0;
    if(hasDebitCredit){
      debit = debitIdx>=0 ? parseNum(r[debitIdx]) : 0;
      credit = creditIdx>=0 ? parseNum(r[creditIdx]) : 0;
    } else {
      const amt = parseNum(r[amountIdx]);
      const typeVal = typeIdx>=0 ? String(r[typeIdx]||'').trim().toLowerCase() : '';
      if(typeVal.startsWith('cr')) credit = Math.abs(amt);
      else if(typeVal.startsWith('dr')) debit = Math.abs(amt);
      else if(amt<0) credit = Math.abs(amt);
      else debit = amt;
    }
    const groupNameHint = groupIdx>=0 ? String(r[groupIdx]||'').trim() : '';
    const existing = state.ledgers.find(l=> l.name.trim().toLowerCase()===name.toLowerCase());
    const hintGroup = groupNameHint ? state.groups.find(g=> g.name.toLowerCase()===groupNameHint.toLowerCase()) : null;
    const guessed = hintGroup || guessGroupForName(name);
    return {
      name, debit, credit,
      matchLedgerId: existing ? existing.id : '__NEW__',
      newGroupId: existing ? '' : (guessed ? guessed.id : ''),
      include: !!name
    };
  }).filter(r=> r.name);
}
async function handleTBImportFile(input){
  const file = input.files && input.files[0];
  if(!file) return;
  tbImportWarning = '';
  try{
    let aoa;
    if(/\.xlsx?$/i.test(file.name)){
      if(typeof ExcelJS==='undefined'){ tbImportWarning = 'Excel import needs an internet connection to load the Excel library — try a CSV file instead.'; renderModal(); return; }
      const buf = await file.arrayBuffer();
      const wb = new ExcelJS.Workbook();
      await wb.xlsx.load(buf);
      const ws = wb.worksheets[0];
      aoa = [];
      ws.eachRow({includeEmpty:false}, row=>{
        const vals = [];
        row.eachCell({includeEmpty:true}, cell=> vals.push(cell.text!=null ? cell.text : (cell.value==null?'':String(cell.value))));
        aoa.push(vals);
      });
    } else {
      const text = await file.text();
      aoa = csvParseText(text);
    }
    buildTBImportRows(aoa);
    tbImportStep = 'review';
    renderModal();
  }catch(err){
    console.error(err);
    tbImportWarning = 'Could not read that file — make sure it\'s a valid CSV or .xlsx export.';
    renderModal();
  }
}
function tbImportSetField(idx, field, value){
  const row = tbImportRows[idx];
  if(!row) return;
  if(field==='debit') row.debit = parseNum(value);
  else if(field==='credit') row.credit = parseNum(value);
  else if(field==='name') row.name = value;
  else if(field==='matchLedgerId') row.matchLedgerId = value;
  else if(field==='newGroupId') row.newGroupId = value;
  else if(field==='include') row.include = value;
  renderModal();
}
function confirmTBImport(){
  const rows = tbImportRows.filter(r=>r.include);
  if(!rows.length){ toast('No rows selected to import'); return; }
  const unresolved = rows.find(r=> r.matchLedgerId==='__NEW__' && !r.newGroupId);
  if(unresolved){ toast(`Choose a group for "${unresolved.name}" before importing`); return; }
  let created = 0, updated = 0;
  rows.forEach(r=>{
    const net = r.debit - r.credit;
    const openingBalance = Math.abs(net);
    const openingType = net >= 0 ? 'Dr' : 'Cr';
    if(r.matchLedgerId && r.matchLedgerId!=='__NEW__'){
      const l = ledgerById(r.matchLedgerId);

    } else {

      created++;
    }
  });

  tbImportModalOpen = false;
  activeTab = 'trialbalance';
  render();
  toast(`Imported: ${created} new ledger${created===1?'':'s'}, ${updated} updated. Set as opening balances as of ${state.meta.periodStart}.`);

function nextVoucherNo(type){
  const prefix = VOUCHER_PREFIX[type] || 'JV';
  const count = state.entries.filter(e=>(e.voucherType||'Journal')===type).length;
  return prefix + '-' + String(count+1).padStart(4,'0');
}

function fmt(n){
  n = Math.round((n||0)*100)/100;
  const neg = n < -0.004;
  const abs = Math.abs(n);
  const s = abs.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
  return neg ? `(${s})` : s;
}
function fmtSigned(n){ return (n<0?'-':'') + fmt(Math.abs(n)); }

function groupById(id){ return state.groups.find(g=>g.id===id); }
function ledgerById(id){ return state.ledgers.find(l=>l.id===id); }
function ledgersInGroup(gid){ return state.ledgers.filter(l=>l.groupId===gid); }

function entriesUpTo(dateEnd){
  return state.entries.filter(e=> e.date <= dateEnd).sort((a,b)=> a.date.localeCompare(b.date) || a.id.localeCompare(b.id));
}
function entriesInPeriod(){
  const {periodStart,periodEnd} = state.meta;
  return state.entries.filter(e=> e.date >= periodStart && e.date <= periodEnd).sort((a,b)=> a.date.localeCompare(b.date) || a.id.localeCompare(b.id));
}

function entriesBefore(dateStart){
  return state.entries.filter(e=> e.date < dateStart).sort((a,b)=> a.date.localeCompare(b.date) || a.id.localeCompare(b.id));
}

// Trial balance as at periodEnd (opening + all entries dated <= periodEnd), broken into
// Opening balance / During-the-period movement / Closing balance per ledger.
function computeTrialBalance(){
  const rows = [];
  const before = entriesBefore(state.meta.periodStart);
  const period = entriesInPeriod();
  state.ledgers.forEach(l=>{
    let openingDebit = l.openingType==='Dr' ? Number(l.openingBalance||0) : 0;
    let openingCredit = l.openingType==='Cr' ? Number(l.openingBalance||0) : 0;
    before.forEach(e=>{
      e.lines.forEach(ln=>{
        if(ln.ledgerId===l.id){ openingDebit += Number(ln.debit||0); openingCredit += Number(ln.credit||0); }
      });
    });
    let periodDebit = 0, periodCredit = 0;
    period.forEach(e=>{
      e.lines.forEach(ln=>{
        if(ln.ledgerId===l.id){ periodDebit += Number(ln.debit||0); periodCredit += Number(ln.credit||0); }
      });
    });
    const debit = openingDebit + periodDebit, credit = openingCredit + periodCredit;
    const openingNet = openingDebit - openingCredit;
    const net = debit - credit;
    rows.push({
      ledger:l, group:groupById(l.groupId),
      openingDebit, openingCredit, openingDr: openingNet>=0 ? openingNet : 0, openingCr: openingNet<0 ? -openingNet : 0,
      periodDebit, periodCredit,
      totalDebit:debit, totalCredit:credit,
      dr: net>=0 ? net : 0, cr: net<0 ? -net : 0
    });
  });
  return rows;
}

function tbBalanceFor(ledgerId){
  const tb = computeTrialBalance();
  const row = tb.find(r=>r.ledger.id===ledgerId);
  if(!row) return 0;
  return row.dr - row.cr; // signed, Dr positive
}

      <button class="btn small" onclick="saveLedger('${isNew?'':l.id}')">Save</button>
      <button class="btn secondary small" onclick="cancelLedgerEdit()">Cancel</button>
    </td>
  </tr>`;
}
function editLedger(id){ editingLedgerId = id; editingGroupId = null; render(); }
function cancelLedgerEdit(){ editingLedgerId = null; render(); }
function saveLedger(id){
  const name = document.getElementById('le-name').value.trim();
  if(!name){ toast('Ledger name is required'); return; }
  const groupId = document.getElementById('le-group').value;
  const openingBalance = Number(document.getElementById('le-amt').value||0);
  const openingType = document.getElementById('le-type').value;
  const currency = document.getElementById('le-currency').value;
  if(id){
    const l = ledgerById(id);
    Object.assign(l,{name,groupId,openingBalance,openingType,currency});
  } else {
    state.ledgers.push({id:uid('l'),name,groupId,openingBalance,openingType,currency});
  }
  persist(); editingLedgerId=null; render(); toast('Ledger saved');
}
function deleteLedger(id){
  const used = state.entries.some(e=>e.lines.some(l=>l.ledgerId===id));
  if(used){ toast('Cannot delete — ledger is used in journal entries'); return; }
  if(!confirm('Delete this ledger?')) return;
  state.ledgers = state.ledgers.filter(l=>l.id!==id);
  persist(); render(); toast('Ledger deleted');
}

/* ============================= JOURNAL ENTRY ============================= */
function renderJournal(){
  const total = {d:0,c:0};
  jLines.forEach(l=>{ total.d += Number(l.debit||0); total.c += Number(l.credit||0); });
  const diff = Math.round((total.d-total.c)*100)/100;
  const balanced = Math.abs(diff) < 0.005 && total.d>0;
  const validLines = jLines.filter(l=>l.ledgerId && (Number(l.debit||0)>0 || Number(l.credit||0)>0)).length >= 2;

  return `
  <div class="pagehead"><div><div class="eyebrow">${editingEntryId?'Editing entry':'Post a transaction'}</div><h1>${editingEntryId?'Edit Journal Entry':'New Journal Entry'}</h1><p class="sub">Every entry must balance — total debits must equal total credits.</p></div></div>
  <div class="sheet">
    <div class="row3">
      <div class="field"><label>Voucher Type</label><select id="j-vtype" onchange="jVoucherType=this.value;render();">${VOUCHER_TYPES.map(v=>`<option value="${v}" ${v===jVoucherType?'selected':''}>${v}</option>`).join('')}</select></div>
      <div class="field"><label>Date</label><input type="date" id="j-date" value="${jDate || todayISO()}"></div>
      <div class="field"><label>Narration</label><input type="text" id="j-narr" value="${esc(jNarr||'')}" placeholder="Brief description of the transaction"></div>
    </div>
    <div class="hint" style="margin:-6px 0 12px;">${VOUCHER_HINT[jVoucherType]||''} ${!editingEntryId?`Will be numbered <b class="num">${nextVoucherNo(jVoucherType)}</b>.`:''}</div>
    <div style="margin-top:16px;margin-bottom:6px;">
      <div class="jline" style="font-size:11px;color:var(--slate);text-transform:uppercase;letter-spacing:.05em;"><span>Ledger</span><span>Debit</span><span>Credit</span><span></span></div>
      ${jLines.map((l,i)=>{
        const foreign = isForeignLedger(l.ledgerId);
        const led = ledgerById(l.ledgerId);
        const fxComputed = Math.round(Number(l.fxAmount||0)*Number(l.fxRate||0)*100)/100;
        return `
        <div class="jline-wrap">
        <div class="jline">
          <select onchange="handleJLedgerSelect(${i}, this.value)">
            <option value="">— select ledger —</option>
            ${state.ledgers.map(led2=>`<option value="${led2.id}" ${led2.id===l.ledgerId?'selected':''}>${esc(led2.name)}${led2.currency&&led2.currency!==baseCurrency()?' ('+esc(led2.currency)+')':''}</option>`).join('')}
            <option value="__NEW__" style="font-weight:600;">+ Create new ledger…</option>
          </select>
          <input type="number" step="0.01" id="jd-${i}" placeholder="0.00" value="${l.debit}" ${foreign?'readonly':''} oninput="onDebitInput(${i}, this.value)">
          <input type="number" step="0.01" id="jc-${i}" placeholder="0.00" value="${l.credit}" ${foreign?'readonly':''} oninput="onCreditInput(${i}, this.value)">
          <button class="rm" onclick="removeJLine(${i})" title="Remove line">✕</button>
        </div>
        ${foreign ? `
        <div class="jline-fx">
          <span class="fx-badge">🌐 ${esc(led.currency)}</span>
          <select id="jfxs-${i}" onchange="onFxSideChange(${i}, this.value)">
            <option value="debit" ${l.fxSide!=='credit'?'selected':''}>Dr</option>
            <option value="credit" ${l.fxSide==='credit'?'selected':''}>Cr</option>
          </select>
          <input type="number" step="0.0001" id="jfxa-${i}" placeholder="Amount in ${esc(led.currency)}" value="${l.fxAmount}" oninput="onFxInput(${i})" style="width:140px;">
          <span class="fx-at">@ rate</span>
          <input type="number" step="0.0001" id="jfxr-${i}" placeholder="e.g. 133.50" value="${l.fxRate}" oninput="onFxInput(${i})" style="width:100px;">
          <span class="fx-eq" id="jfxeq-${i}">= ${baseCurrency()} ${fmt(fxComputed)}</span>
        </div>` : ''}
        </div>`;
      }).join('')}
      <button class="btn secondary small" style="margin-top:6px;" onclick="addJLine()">+ Add Line</button>
    </div>
    ${jNewLedgerLineIndex!==null ? `
    <div class="sheet tight" style="background:#FBF0DA;border-color:var(--brass);margin:4px 0 16px;">
      <div class="card-title" style="margin-bottom:10px;padding-bottom:8px;">New Ledger for Line ${jNewLedgerLineIndex+1}<button class="btn secondary small" onclick="cancelNewLedgerFromJournal()">Cancel</button></div>
      <div class="row3">
        <div class="field"><label>Ledger Name</label><input type="text" id="jnl-name" placeholder="e.g. Office Rent"></div>
        <div class="field"><label>Group</label><select id="jnl-group">${state.groups.map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join('')}</select></div>
        <div class="field"><label>Opening Balance</label>
          <div style="display:flex;gap:6px;">
            <input type="number" step="0.01" id="jnl-amt" value="0" style="width:100%;">
            <select id="jnl-type" style="width:78px;"><option value="Dr">Dr</option><option value="Cr">Cr</option></select>
          </div>
        </div>
      </div>
      <button class="btn brass small" onclick="saveNewLedgerFromJournal()">Save &amp; Use Ledger</button>
    </div>` : ''}
    <div class="jtotals">
      <div><span class="lbl">Total Debit</span><span class="num" id="jt-debit">${fmt(total.d)}</span></div>
      <div><span class="lbl">Total Credit</span><span class="num" id="jt-credit">${fmt(total.c)}</span></div>
      <div><span class="lbl">Difference</span><span class="num balance-flag ${Math.abs(diff)<0.005?'pos':'neg'}" id="jt-diff">${fmt(diff)}</span></div>
    </div>
    ${!editingEntryId ? `
    <div class="field no-print" style="margin-top:14px;">
      <label style="display:inline-flex;align-items:center;gap:6px;font-weight:400;">
        <input type="checkbox" id="j-save-template" style="width:auto;" onchange="document.getElementById('j-template-name-wrap').style.display=this.checked?'block':'none';">
        Also save as a reusable template
      </label>
      <div id="j-template-name-wrap" style="display:none;margin-top:8px;max-width:340px;">
        <input type="text" id="j-template-name" placeholder="Template name (e.g. Monthly Office Rent)">
      </div>
    </div>` : ''}
    <div style="margin-top:16px;display:flex;gap:10px;">
      <button class="btn brass" id="j-save-btn" ${(!balanced||!validLines)?'disabled':''} onclick="saveJournalEntry()">${editingEntryId?'Update Entry':'Save Entry'}</button>
      ${editingEntryId?'<button class="btn secondary" onclick="cancelJournalEdit()">Cancel</button>':''}
    </div>
    <div id="j-hint">${!validLines? '<div class="hint">Add at least two lines with a ledger and an amount.</div>' : (!balanced? '<div class="hint">Entry is not balanced yet.</div>':'')}</div>
  </div>`;
}
function onDebitInput(i, val){
  jLines[i].debit = val;
  if(val){ jLines[i].credit=''; const c=document.getElementById('jc-'+i); if(c) c.value=''; }
  updateJTotals();
}
function onCreditInput(i, val){
  jLines[i].credit = val;
  if(val){ jLines[i].debit=''; const d=document.getElementById('jd-'+i); if(d) d.value=''; }
  updateJTotals();
}
function updateJTotals(){
  let d=0,c=0;
  jLines.forEach(l=>{ d+=Number(l.debit||0); c+=Number(l.credit||0); });
  const diff = Math.round((d-c)*100)/100;
  const balanced = Math.abs(diff)<0.005 && d>0;
  const validLines = jLines.filter(l=>l.ledgerId && (Number(l.debit||0)>0||Number(l.credit||0)>0)).length>=2;
  const de=document.getElementById('jt-debit'); if(de) de.textContent=fmt(d);
  const ce=document.getElementById('jt-credit'); if(ce) ce.textContent=fmt(c);
  const df=document.getElementById('jt-diff'); if(df){ df.textContent=fmt(diff); df.className='num balance-flag '+(Math.abs(diff)<0.005?'pos':'neg'); }
  const btn=document.getElementById('j-save-btn'); if(btn) btn.disabled = !(balanced&&validLines);
  const hint=document.getElementById('j-hint');
  if(hint){
    if(!validLines) hint.innerHTML='<div class="hint">Add at least two lines with a ledger and an amount.</div>';
    else if(!balanced) hint.innerHTML='<div class="hint">Entry is not balanced yet.</div>';
    else hint.innerHTML='';
  }
}
let jDate = null, jNarr = '';
let jVoucherType = 'Journal';
let jNewLedgerLineIndex = null; // index of the journal line currently creating a new ledger inline
function addJLine(){ jLines.push({ledgerId:'',debit:'',credit:'',fxAmount:'',fxRate:'',fxSide:'debit'}); render(); }
function removeJLine(i){ jLines.splice(i,1); if(jLines.length<2){ jLines.push({ledgerId:'',debit:'',credit:'',fxAmount:'',fxRate:'',fxSide:'debit'}); } render(); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function handleJLedgerSelect(i, val){
  if(val==='__NEW__'){
    jNewLedgerLineIndex = i;
    render();
    setTimeout(()=>{ const el=document.getElementById('jnl-name'); if(el) el.focus(); }, 0);
  } else {
    jLines[i].ledgerId = val;
    if(isForeignLedger(val)){
      jLines[i].fxAmount = jLines[i].fxAmount || '';
      jLines[i].fxRate = jLines[i].fxRate || '';
      jLines[i].fxSide = jLines[i].fxSide || 'debit';
    }
    render();
    updateJTotals();
  }
}
function onFxSideChange(i, val){ jLines[i].fxSide = val; applyFxLine(i); render(); updateJTotals(); }
function onFxInput(i){
  const a = document.getElementById('jfxa-'+i), r = document.getElementById('jfxr-'+i);
  jLines[i].fxAmount = a ? a.value : jLines[i].fxAmount;
  jLines[i].fxRate = r ? r.value : jLines[i].fxRate;
  applyFxLine(i);
  const dEl = document.getElementById('jd-'+i), cEl = document.getElementById('jc-'+i), eqEl = document.getElementById('jfxeq-'+i);
  if(dEl) dEl.value = jLines[i].debit;
  if(cEl) cEl.value = jLines[i].credit;
  if(eqEl) eqEl.textContent = '= ' + baseCurrency() + ' ' + fmt(Number(jLines[i].debit||jLines[i].credit||0));
  updateJTotals();
}
function applyFxLine(i){
  const l = jLines[i];
  const base = Math.round(Number(l.fxAmount||0)*Number(l.fxRate||0)*100)/100;
  if(l.fxSide==='credit'){ l.debit=''; l.credit = base||''; }
  else { l.credit=''; l.debit = base||''; }
}
function cancelNewLedgerFromJournal(){ jNewLedgerLineIndex = null; render(); }
function saveNewLedgerFromJournal(){
  const name = document.getElementById('jnl-name').value.trim();
  if(!name){ toast('Ledger name is required'); return; }
  const groupId = document.getElementById('jnl-group').value;
  const openingBalance = Number(document.getElementById('jnl-amt').value||0);
  const openingType = document.getElementById('jnl-type').value;
  const newLedger = {id:uid('l'), name, groupId, openingBalance, openingType};
  state.ledgers.push(newLedger);
  persist();
  const idx = jNewLedgerLineIndex;
  jNewLedgerLineIndex = null;
  if(idx!==null && jLines[idx]) jLines[idx].ledgerId = newLedger.id;
  render();
  updateJTotals();
  toast('Ledger "'+name+'" created and selected');
}

function saveJournalEntry(){
  const date = document.getElementById('j-date').value || todayISO();
  const narration = document.getElementById('j-narr').value.trim();
  const voucherType = document.getElementById('j-vtype') ? document.getElementById('j-vtype').value : jVoucherType;
  const lines = jLines.filter(l=>l.ledgerId && (Number(l.debit||0)>0 || Number(l.credit||0)>0))
    .map(l=>{
      const base = {ledgerId:l.ledgerId, debit:Number(l.debit||0), credit:Number(l.credit||0)};
      if(isForeignLedger(l.ledgerId) && Number(l.fxAmount||0)>0){
        const led = ledgerById(l.ledgerId);
        base.fxCurrency = led.currency; base.fxAmount = Number(l.fxAmount||0); base.fxRate = Number(l.fxRate||0);
      }
      return base;
    });
  const td = lines.reduce((s,l)=>s+l.debit,0), tc = lines.reduce((s,l)=>s+l.credit,0);
  if(lines.length<2 || Math.abs(td-tc)>0.005){ toast('Entry must balance with at least 2 lines'); return; }
  if(editingEntryId){
    const e = state.entries.find(x=>x.id===editingEntryId);
    Object.assign(e,{date,narration,lines,voucherType});
    toast('Entry updated');
  } else {
    state.entries.push({id:uid('e'), date, narration, lines, voucherType, voucher: nextVoucherNo(voucherType)});
    const tplCheck = document.getElementById('j-save-template');
    if(tplCheck && tplCheck.checked){
      const tplName = (document.getElementById('j-template-name').value||'').trim();
      if(tplName){
        state.templates.push({id:uid('tpl'), name:tplName, voucherType, narration, lines: lines.map(l=>({...l}))});
        toast('Entry saved and template "'+tplName+'" created');
      } else {
        toast('Entry saved (template name was blank, so no template was created)');
      }
    } else {
      toast('Entry saved');
    }
  }
  persist();
  editingEntryId = null; jDate=null; jNarr=''; jVoucherType='Journal';
  jLines = [ {ledgerId:'', debit:'', credit:'', fxAmount:'', fxRate:'', fxSide:'debit'}, {ledgerId:'', debit:'', credit:'', fxAmount:'', fxRate:'', fxSide:'debit'} ];
  goTab('register');
}
function cancelJournalEdit(){
  editingEntryId=null; jDate=null; jNarr=''; jNewLedgerLineIndex=null; jVoucherType='Journal';
  jLines = [ {ledgerId:'', debit:'', credit:'', fxAmount:'', fxRate:'', fxSide:'debit'}, {ledgerId:'', debit:'', credit:'', fxAmount:'', fxRate:'', fxSide:'debit'} ];
  goTab('register');
}

/* ============================= JOURNAL REGISTER ============================= */
let openEntryId = null;
let registerFilterType = 'All';
function renderRegister(){
  const all = [...state.entries].sort((a,b)=> b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
  const list = registerFilterType==='All' ? all : all.filter(e=>(e.voucherType||'Journal')===registerFilterType);
  return `
  <div class="pagehead"><div><div class="eyebrow">Records</div><h1>Journal Register</h1><p class="sub">${list.length} of ${all.length} entr${all.length===1?'y':'ies'} shown.</p></div>
  ${all.length? renderExportBar('exportRegisterCSV','exportRegisterXLSX', `<button class="btn brass" onclick="goTab('journal')">+ New Entry</button>`, 'All Entries') : `<div class="export-bar no-print"><button class="btn brass" onclick="goTab('journal')">+ New Entry</button></div>`}
  </div>
  ${all.length? `<div class="sheet tight no-print" style="max-width:280px;margin-bottom:16px;">
    <label>Filter by Voucher Type</label>
    <select onchange="registerFilterType=this.value;render();">
      <option value="All" ${registerFilterType==='All'?'selected':''}>All Types</option>
      ${VOUCHER_TYPES.map(v=>`<option value="${v}" ${v===registerFilterType?'selected':''}>${v}</option>`).join('')}
    </select>
  </div>` : ''}
  ${list.length===0? `<div class="sheet"><div class="empty">${all.length? 'No entries match this filter.' : 'No journal entries yet.'}</div></div>` :
  list.map(e=>{
    const td = e.lines.reduce((s,l)=>s+l.debit,0);
    const vtype = e.voucherType||'Journal';
    return `<div class="entry-block">
      <div class="entry-head" onclick="toggleEntry('${e.id}')">
        <div style="display:flex;gap:14px;align-items:center;">
          <span class="tag ${VOUCHER_CLASS[vtype]||'vt-journal'}">${vtype}</span>
          <span class="vno">${e.voucher||'JV'}</span><span class="date">${e.date}</span>
          <span style="font-size:13px;">${esc(e.narration||'—')}</span>
        </div>
        <div style="display:flex;gap:10px;align-items:center;">
          <span class="num">${fmt(td)}</span>
          <button class="btn secondary small no-print" onclick="event.stopPropagation();saveAsTemplateFromEntry('${e.id}')" title="Save as a reusable template">${icon('repeat','btn-icon')}</button>
          <button class="btn secondary small no-print" onclick="event.stopPropagation();startEditEntry('${e.id}')">Edit</button>
          <button class="btn danger small no-print" onclick="event.stopPropagation();deleteEntry('${e.id}')">Delete</button>
        </div>
      </div>
      <div class="entry-body ${openEntryId===e.id?'open':''}" id="body-${e.id}">
        <table><thead><tr><th>Ledger</th><th class="num">Debit</th><th class="num">Credit</th></tr></thead>
        <tbody>${e.lines.map(l=>`<tr><td>${esc(ledgerById(l.ledgerId)?.name||'—')}${l.fxCurrency?` <span class="tag" title="${l.fxAmount} ${esc(l.fxCurrency)} @ ${l.fxRate}">🌐 ${l.fxAmount} ${esc(l.fxCurrency)} @ ${l.fxRate}</span>`:''}</td><td class="num">${l.debit?fmt(l.debit):''}</td><td class="num">${l.credit?fmt(l.credit):''}</td></tr>`).join('')}</tbody></table>
      </div>
    </div>`;
  }).join('')}`;
}
function toggleEntry(id){ openEntryId = (openEntryId===id)? null : id; render(); }
function startEditEntry(id){
  const e = state.entries.find(x=>x.id===id);
  if(!e) return;
  editingEntryId = id; jDate = e.date; jNarr = e.narration; jNewLedgerLineIndex = null; jVoucherType = e.voucherType || 'Journal';
  jLines = e.lines.map(l=>({ledgerId:l.ledgerId, debit:l.debit||'', credit:l.credit||'', fxAmount:l.fxAmount||'', fxRate:l.fxRate||'', fxSide:l.credit?'credit':'debit'}));
  goTab('journal');
}
function deleteEntry(id){
  if(!confirm('Delete this journal entry? This cannot be undone.')) return;
  state.entries = state.entries.filter(e=>e.id!==id);
  persist(); render(); toast('Entry deleted');
}
function saveAsTemplateFromEntry(id){
  const e = state.entries.find(x=>x.id===id);
  if(!e) return;
  const name = prompt('Name this template (e.g. "Monthly Office Rent"):', e.narration||'');
  if(!name || !name.trim()) return;
  state.templates.push({
    id: uid('tpl'), name: name.trim(), voucherType: e.voucherType||'Journal', narration: e.narration||'',
    lines: e.lines.map(l=>({ledgerId:l.ledgerId, debit:l.debit||0, credit:l.credit||0}))
  });
  persist();
  toast('Saved as template: '+name.trim());
}

/* ============================= RECURRING TEMPLATES ============================= */
let tLines = [];
let tName = '', tVoucherType = 'Journal', tNarr = '';
let tShowForm = false;
let editingTemplateId = null;

function renderTemplates(){
  const list = state.templates || [];
  let html = `
  <div class="pagehead"><div><div class="eyebrow">Standing entries</div><h1>Recurring Entries</h1><p class="sub">Save common transactions as templates and post them again in one click — rent, EMIs, depreciation, anything you repeat.</p></div>
  <div class="export-bar no-print">${!tShowForm && !editingTemplateId ? `<button class="btn brass" onclick="showNewTemplateForm()">+ New Template</button>` : ''}</div></div>`;

  if(tShowForm && !editingTemplateId) html += templateFormHtml(null);

  if(list.length){
    html += list.map(t=> editingTemplateId===t.id ? templateFormHtml(t) : templateCardHtml(t)).join('');
  } else if(!tShowForm){
    html += `<div class="sheet"><div class="empty">No templates yet. Save one from an existing entry in the Journal Register (${icon('repeat','btn-icon')} icon), or create one here.</div></div>`;

  return html;
}

function templateCardHtml(t){

    <div class="entry-head" style="cursor:default;">

        <b style="font-size:13px;white-space:nowrap;">${esc(t.name)}</b>

      </div>
      <div style="display:flex;gap:8px;align-items:center;flex-shrink:0;">
        <span class="num">${fmt(total)}</span>

    </div>

    </div>
  </div>`;
}

function templateFormHtml(existing){
  const isNew = !existing;
  const total = {d:0,c:0};
  tLines.forEach(l=>{ total.d += Number(l.debit||0); total.c += Number(l.credit||0); });
  const diff = Math.round((total.d-total.c)*100)/100;
  const balanced = Math.abs(diff) < 0.005 && total.d>0;
  const validLines = tLines.filter(l=>l.ledgerId && (Number(l.debit||0)>0 || Number(l.credit||0)>0)).length >= 2;
  return `
  <div class="sheet spine-brass" style="margin-bottom:16px;">
    <div class="card-title">${isNew?'New Template':'Edit Template'}</div>
    <div class="row2">
      <div class="field"><label>Template Name</label><input type="text" id="t-name" value="${esc(tName)}" placeholder="e.g. Monthly Office Rent"></div>

function addTLine(){ tLines.push({ledgerId:'',debit:'',credit:''}); render(); }
function removeTLine(i){ tLines.splice(i,1); if(tLines.length<2){ tLines.push({ledgerId:'',debit:'',credit:''}); } render(); }
function onTDebitInput(i, val){
  tLines[i].debit = val;
  if(val){ tLines[i].credit=''; const c=document.getElementById('tc-'+i); if(c) c.value=''; }
  updateTTotals();
}
function onTCreditInput(i, val){
  tLines[i].credit = val;
  if(val){ tLines[i].debit=''; const d=document.getElementById('td-'+i); if(d) d.value=''; }
  updateTTotals();
}
function updateTTotals(){
  let d=0,c=0;
  tLines.forEach(l=>{ d+=Number(l.debit||0); c+=Number(l.credit||0); });
  const diff = Math.round((d-c)*100)/100;
  const balanced = Math.abs(diff)<0.005 && d>0;
  const validLines = tLines.filter(l=>l.ledgerId && (Number(l.debit||0)>0||Number(l.credit||0)>0)).length>=2;
  const de=document.getElementById('tt-debit'); if(de) de.textContent=fmt(d);
  const ce=document.getElementById('tt-credit'); if(ce) ce.textContent=fmt(c);
  const df=document.getElementById('tt-diff'); if(df){ df.textContent=fmt(diff); df.className='num balance-flag '+(Math.abs(diff)<0.005?'pos':'neg'); }
  const btn=document.getElementById('t-save-btn'); if(btn) btn.disabled = !(balanced&&validLines);
}
function saveTemplateForm(id){
  const name = document.getElementById('t-name').value.trim();
  if(!name){ toast('Template name is required'); return; }
  const voucherType = document.getElementById('t-vtype').value;
  const narration = document.getElementById('t-narr').value.trim();
  const lines = tLines.filter(l=>l.ledgerId && (Number(l.debit||0)>0 || Number(l.credit||0)>0))
    .map(l=>({ledgerId:l.ledgerId, debit:Number(l.debit||0), credit:Number(l.credit||0)}));
  const td = lines.reduce((s,l)=>s+l.debit,0), tc = lines.reduce((s,l)=>s+l.credit,0);
  if(lines.length<2 || Math.abs(td-tc)>0.005){ toast('Template must balance with at least 2 lines'); return; }
  if(id){
    const t = state.templates.find(x=>x.id===id);
    Object.assign(t, {name, voucherType, narration, lines});
  } else {
    state.templates.push({id:uid('tpl'), name, voucherType, narration, lines});
  }
  persist();
  tShowForm=false; editingTemplateId=null; tLines=[]; tName=''; tVoucherType='Journal'; tNarr='';
  render();
  toast('Template saved');
}

}

let selectedLedgerId = null;
function getLedgerRows(ledgerId){
  const l = ledgerById(ledgerId);
  if(!l) return {ledger:null, rows:[], closing:0};
  let rows = [];
  // Opening balance as at Period Start = the ledger's raw opening balance plus everything
  // dated before Period Start, rolled into one line — mirrors how Trial Balance splits
  // "opening" from "movement", so switching the report range actually moves this line.
  let running = l.openingType==='Dr' ? Number(l.openingBalance||0) : -Number(l.openingBalance||0);
  entriesBefore(state.meta.periodStart).forEach(e=> e.lines.forEach(ln=>{
    if(ln.ledgerId===l.id) running += Number(ln.debit||0) - Number(ln.credit||0);
  }));
  rows.push({date:state.meta.periodStart, particulars:'Opening Balance', debit: running>0?running:0, credit: running<0?-running:0, bal:running, opening:true});
  entriesInPeriod().forEach(e=>{
    e.lines.forEach(ln=>{
      if(ln.ledgerId===l.id){
        running += Number(ln.debit||0) - Number(ln.credit||0);
        const others = e.lines.filter(x=>x!==ln).map(x=>ledgerById(x.ledgerId)?.name).filter(Boolean).join(', ');
        rows.push({date:e.date, particulars: (e.narration||others||'—') + (others? ` (${others})`:''), debit:Number(ln.debit||0), credit:Number(ln.credit||0), bal:running, voucher:e.voucher, fx: ln.fxCurrency?{amount:ln.fxAmount,rate:ln.fxRate,currency:ln.fxCurrency}:null});
      }
    });
  });
  return {ledger:l, rows, closing:running};
}

  return `

/* ============================= P&L ============================= */
function plFigures(){
  const tb = computeTrialBalance();
  const byGroup = (nature, sub) => tb.filter(r=>r.group.nature===nature && r.group.subCategory===sub);
  const sumCr = rows => rows.reduce((s,r)=>s+(r.cr-r.dr),0);
  const sumDr = rows => rows.reduce((s,r)=>s+(r.dr-r.cr),0);
  const directIncome = byGroup('Income','Direct'), indirectIncome = byGroup('Income','Indirect');
  const directExpense = byGroup('Expense','Direct'), indirectExpense = byGroup('Expense','Indirect');
  const revenue = sumCr(directIncome), otherIncome = sumCr(indirectIncome);
  const cos = sumDr(directExpense), opex = sumDr(indirectExpense);
  const grossProfit = revenue - cos;
  const netProfit = grossProfit + otherIncome - opex;
  return {directIncome,indirectIncome,directExpense,indirectExpense,revenue,otherIncome,cos,opex,grossProfit,netProfit};
}
function lineRows(rows, signFn){
  return rows.filter(r=>Math.abs(signFn(r))>0.004).map(r=>`<tr><td style="padding-left:18px;">${esc(r.ledger.name)}</td><td class="num">${fmt(Math.abs(signFn(r)))}</td></tr>`).join('');
}
// Same as lineRows but renders a second "prior period" column, matched by ledger id.
// Ledgers with activity in either period are shown, so a line that only moved last year
// (or only this year) still appears rather than silently dropping out.
function lineRowsCompare(rowsCur, rowsPrior, signFn){
  const byId = new Map();
  rowsCur.forEach(r=> byId.set(r.ledger.id, {name:r.ledger.name, cur:signFn(r), prior:0}));
  rowsPrior.forEach(r=>{
    const ex = byId.get(r.ledger.id);
    if(ex) ex.prior = signFn(r);
    else byId.set(r.ledger.id, {name:r.ledger.name, cur:0, prior:signFn(r)});
  });
  return [...byId.values()].filter(x=>Math.abs(x.cur)>0.004||Math.abs(x.prior)>0.004)
    .map(x=>`<tr><td style="padding-left:18px;">${esc(x.name)}</td><td class="num">${fmt(Math.abs(x.cur))}</td><td class="num">${fmt(Math.abs(x.prior))}</td></tr>`).join('');
}

// Buckets trial-balance rows by their Chart of Accounts group (e.g. "Property, Plant &
// Equipment", "Trade Receivables"), preserving first-seen order. Used to show a
// groupwise subtotal within each SFP section (Non-Current Assets, Current Liabilities, etc).
function groupedByChartGroup(rows){
  const map = new Map();
  rows.forEach(r=>{
    const gid = r.group ? r.group.id : '__ungrouped__';
    if(!map.has(gid)) map.set(gid, {name: r.group ? r.group.name : 'Ungrouped', rows: []});
    map.get(gid).rows.push(r);
  });
  return [...map.values()];
}
// Same rendering as lineRows, but inserts a "Total <Group Name>" row after each
// Chart of Accounts group's ledgers. Falls back to plain lineRows when group
// totals are switched off.
function sfpLineRows(rows, signFn, showGroupTotals){
  if(!showGroupTotals) return lineRows(rows, signFn);
  let html = '';
  groupedByChartGroup(rows).forEach(g=>{
    const filtered = g.rows.filter(r=>Math.abs(signFn(r))>0.004);
    if(!filtered.length) return;
    filtered.forEach(r=>{ html += `<tr><td style="padding-left:18px;">${esc(r.ledger.name)}</td><td class="num">${fmt(Math.abs(signFn(r)))}</td></tr>`; });
    const total = filtered.reduce((s,r)=>s+signFn(r),0);
    html += `<tr class="chart-group-total"><td style="padding-left:18px;">Total ${esc(g.name)}</td><td class="num">${fmt(Math.abs(total))}</td></tr>`;
  });
  return html;
}
// Same as lineRowsCompare, but with a "Total <Group Name>" row (current + prior
// columns) after each Chart of Accounts group. Falls back to lineRowsCompare when
// group totals are switched off.
function sfpLineRowsCompare(rowsCur, rowsPrior, signFn, showGroupTotals){
  if(!showGroupTotals) return lineRowsCompare(rowsCur, rowsPrior, signFn);
  const groupName = new Map();
  rowsCur.forEach(r=>{ if(r.group) groupName.set(r.group.id, r.group.name); });
  rowsPrior.forEach(r=>{ if(r.group) groupName.set(r.group.id, r.group.name); });
  const order = [];
  const byGroup = new Map();
  const ensure = gid => { if(!byGroup.has(gid)){ byGroup.set(gid, new Map()); order.push(gid); } return byGroup.get(gid); };
  rowsCur.forEach(r=>{
    const gid = r.group ? r.group.id : '__ungrouped__';
    ensure(gid).set(r.ledger.id, {name:r.ledger.name, cur:signFn(r), prior:0});
  });
  rowsPrior.forEach(r=>{
    const gid = r.group ? r.group.id : '__ungrouped__';
    const m = ensure(gid);
    const ex = m.get(r.ledger.id);
    if(ex) ex.prior = signFn(r);
    else m.set(r.ledger.id, {name:r.ledger.name, cur:0, prior:signFn(r)});
  });
  let html = '';
  order.forEach(gid=>{
    const entries = [...byGroup.get(gid).values()].filter(x=>Math.abs(x.cur)>0.004||Math.abs(x.prior)>0.004);
    if(!entries.length) return;
    entries.forEach(x=>{ html += `<tr><td style="padding-left:18px;">${esc(x.name)}</td><td class="num">${fmt(Math.abs(x.cur))}</td><td class="num">${fmt(Math.abs(x.prior))}</td></tr>`; });
    const totCur = entries.reduce((s,x)=>s+x.cur,0), totPrior = entries.reduce((s,x)=>s+x.prior,0);
    const gname = gid==='__ungrouped__' ? 'Ungrouped' : groupName.get(gid);
    html += `<tr class="chart-group-total"><td style="padding-left:18px;">Total ${esc(gname)}</td><td class="num">${fmt(Math.abs(totCur))}</td><td class="num">${fmt(Math.abs(totPrior))}</td></tr>`;
  });
  return html;
}

/* ============================= SFP (Balance Sheet) ============================= */
function computeSFP(){
  const tb = computeTrialBalance();
  const f = plFigures();
  const byGS = (nature,sub)=> tb.filter(r=>r.group.nature===nature && r.group.subCategory===sub);
  const cashRows = tb.filter(r=>r.group.isCash);
  const nca = byGS('Asset','Non-Current'), ca = byGS('Asset','Current');
  const ncl = byGS('Liability','Non-Current'), cl = byGS('Liability','Current');
  const eq = byGS('Equity','Equity');
  const sumDrNet = rows=> rows.reduce((s,r)=>s+(r.dr-r.cr),0);
  const sumCrNet = rows=> rows.reduce((s,r)=>s+(r.cr-r.dr),0);
  const totalNCA = sumDrNet(nca), totalCA = sumDrNet(ca), totalCash = sumDrNet(cashRows);
  const totalAssets = totalNCA + totalCA + totalCash;
  const totalNCL = sumCrNet(ncl), totalCL = sumCrNet(cl);
  const equityLedgers = sumCrNet(eq);
  const totalEquity = equityLedgers + f.netProfit;
  const totalEqLiab = totalEquity + totalNCL + totalCL;
  const diff = totalAssets - totalEqLiab;
  return {f,nca,ca,cashRows,ncl,cl,eq,totalNCA,totalCA,totalCash,totalAssets,totalNCL,totalCL,equityLedgers,totalEquity,totalEqLiab,diff};
}

/* ============================= CHANGES IN EQUITY ============================= */
function computeEquity(){
  const eqGroups = state.groups.filter(g=>g.nature==='Equity');
  const period = entriesInPeriod();
  const f = plFigures();
  let rows = [];
  eqGroups.forEach(g=>{
    ledgersInGroup(g.id).forEach(l=>{
      const opening = l.openingType==='Cr' ? Number(l.openingBalance||0) : -Number(l.openingBalance||0);
      let movement = 0;
      period.forEach(e=> e.lines.forEach(ln=>{ if(ln.ledgerId===l.id) movement += Number(ln.credit||0)-Number(ln.debit||0); }));
      const closing = opening + movement;
      rows.push({name:l.name, opening, movement, closing, group:g.name});
    });
  });
  const totalOpening = rows.reduce((s,r)=>s+r.opening,0);
  const totalMovement = rows.reduce((s,r)=>s+r.movement,0);
  const totalClosingLedgers = rows.reduce((s,r)=>s+r.closing,0);
  const totalClosing = totalClosingLedgers + f.netProfit;
  return {rows, f, totalOpening, totalMovement, totalClosing};
}
function renderEquity(){
  const {rows, f, totalOpening, totalMovement, totalClosing} = computeEquity();
  return `
  ${renderLetterhead()}
  <div class="pagehead"><div><div class="eyebrow">For the period ${state.meta.periodStart} to ${state.meta.periodEnd}</div><h1>Statement of Changes in Equity</h1><p class="sub">Opening balance, movements during the period, and net profit carried to equity.</p></div>
  ${renderExportBar('exportEquityCSV','exportEquityXLSX')}</div>
  <div class="sheet">

    <tbody>

    <tr><td>Net Profit / (Loss) for the Period</td><td class="num">—</td><td class="num">${fmtSigned(f.netProfit)}</td><td class="num">${fmtSigned(f.netProfit)}</td></tr>

/* ============================= CASH FLOW ============================= */
let cfMethod = 'indirect'; // 'direct' | 'indirect'
function computeCashFlow(){
  const buckets = {Operating:{}, Investing:{}, Financing:{}, Excluded:{}};
  const totals = {Operating:0, Investing:0, Financing:0};
  const period = entriesInPeriod();
  period.forEach(e=>{
    const cashLines = e.lines.filter(l=> groupById(ledgerById(l.ledgerId)?.groupId)?.isCash);
    const otherLines = e.lines.filter(l=> !groupById(ledgerById(l.ledgerId)?.groupId)?.isCash);
    if(!cashLines.length || !otherLines.length) return;
    const netCash = cashLines.reduce((s,l)=>s+Number(l.debit||0)-Number(l.credit||0),0);
    if(Math.abs(netCash)<0.004) return;
    const otherTotal = otherLines.reduce((s,l)=>s+Number(l.debit||0)+Number(l.credit||0),0);
    if(otherTotal<=0) return;

    // Compound entries — e.g. disposing of a fixed asset, which typically debits
    // Cash and Accumulated Depreciation, debits/credits a Gain or Loss on Disposal,
    // and credits the asset at cost, all in one journal entry — represent ONE
    // investing/financing cash transaction, not several. Splitting the cash
    // pro-rata across every leg (the old behaviour below) fragments the sale
    // proceeds across Accumulated Depreciation and Gain/Loss lines too, even
    // though those legs never actually received or paid cash, and even leaks
    // part of it into Operating. Instead:
    //  1. Drop any leg whose group is flagged "Non-cash" (Depreciation,
    //     Gain/Loss on Disposal, etc.) — it's a P&L reconciling item, not a
    //     cash movement, and is handled separately by the Indirect method's
    //     add-back.
    //  2. If every remaining leg is a Non-Current Asset/Liability account (the
    //     asset at cost, its accumulated depreciation, a loan principal, etc.)
    //     sharing the same activity, treat the whole entry as one Investing/
    //     Financing transaction and post the full cash amount under the
    //     largest such leg (normally the asset/liability at original value).
    const nonCashLegs = otherLines.filter(l=> groupById(ledgerById(l.ledgerId)?.groupId)?.nonCash);
    const candidateLines = otherLines.filter(l=> !nonCashLegs.includes(l));
    const nonCurrentLines = candidateLines.filter(l=>{
      const grp = groupById(ledgerById(l.ledgerId)?.groupId);
      return grp && grp.subCategory==='Non-Current' && (grp.nature==='Asset' || grp.nature==='Liability');
    });
    const nonCurrentActivities = new Set(nonCurrentLines.map(l=>groupById(ledgerById(l.ledgerId)?.groupId).cf));
    if(otherLines.length>1 && nonCurrentLines.length>=1 && nonCurrentActivities.size===1 && nonCurrentLines.length===candidateLines.length){
      let rep = nonCurrentLines[0], repAmt = -1;
      nonCurrentLines.forEach(l=>{ const amt = Number(l.debit||0)+Number(l.credit||0); if(amt>repAmt){ repAmt=amt; rep=l; } });
      const grp = groupById(ledgerById(rep.ledgerId)?.groupId);
      const activity = grp?.cf || 'Operating';
      const key = activity === 'Excluded' ? 'Excluded' : activity;
      if(!buckets[key][grp.name]) buckets[key][grp.name] = 0;
      buckets[key][grp.name] += netCash;
      if(totals[key]!==undefined) totals[key]+=netCash;
      return;
    }

    otherLines.forEach(l=>{
      const led = ledgerById(l.ledgerId); const grp = groupById(led?.groupId);
      const lineAmt = Number(l.debit||0)+Number(l.credit||0);
      const portion = netCash * (lineAmt/otherTotal);
      // A debit to a non-cash line paired with net cash inflow typically represents a reduction of that account funded by cash-in (rare);
      // standard case: netCash sign already reflects direction, attribute full portion to this line's group under its activity.
      const activity = grp?.cf || 'Operating';
      const key = activity === 'Excluded' ? 'Excluded' : activity;
      if(!buckets[key][grp.name]) buckets[key][grp.name] = 0;
      buckets[key][grp.name] += portion;
      if(totals[key]!==undefined) totals[key]+=portion;
    });
  });
  const cashRows = computeTrialBalance().filter(r=>r.group.isCash);
  const closingCash = cashRows.reduce((s,r)=>s+(r.dr-r.cr),0);
  let openingCash = 0;
  state.ledgers.filter(l=>groupById(l.groupId)?.isCash).forEach(l=>{
    openingCash += l.openingType==='Dr' ? Number(l.openingBalance||0) : -Number(l.openingBalance||0);
  });
  const netMovement = totals.Operating+totals.Investing+totals.Financing;
  return {buckets, totals, openingCash, closingCash, netMovement};
}

// Indirect method: Operating section starts from Net Profit and adjusts for non-cash items
// and working-capital movements; Investing & Financing sections are identical under both methods.
function computeIndirectCashFlow(){
  const f = plFigures();
  const tb = computeTrialBalance();

  let nonCashAdj = [];
  tb.forEach(r=>{
    if(!r.group.nonCash) return;
    if(r.group.nature==='Expense'){
      const amt = r.dr - r.cr;
      if(Math.abs(amt)>0.004) nonCashAdj.push({name:r.ledger.name, amount:amt});
    } else if(r.group.nature==='Income'){
      const amt = -(r.cr - r.dr);
      if(Math.abs(amt)>0.004) nonCashAdj.push({name:r.ledger.name, amount:amt});
    }
  });
  const totalNonCashAdj = nonCashAdj.reduce((s,x)=>s+x.amount,0);

  // Only Current Asset/Liability groups tagged cf:'Operating' belong in the working-capital
  // section. A Current item tagged Investing or Financing (e.g. Short-term Loans, or a customer
  // advance taken against the sale of a fixed asset) already has its cash impact captured under
  // Investing/Financing above (inherited from the direct method, which respects the cf tag).
  // Sweeping it into working capital as well would double-count that movement and make the
  // Indirect method's Operating total drift from the Direct method's.
  let wc = [];
  state.ledgers.forEach(l=>{
    const g = groupById(l.groupId);
    if(!g) return;
    const tbRow = tb.find(r=>r.ledger.id===l.id);
    if(!tbRow) return;
    if(g.nature==='Asset' && g.subCategory==='Current' && !g.isCash && g.cf==='Operating'){
      const openingBal = l.openingType==='Dr' ? Number(l.openingBalance||0) : -Number(l.openingBalance||0);
      const closingBal = tbRow.dr - tbRow.cr;
      const change = closingBal - openingBal;
      if(Math.abs(change)>0.004) wc.push({name:l.name, amount:-change, kind:'asset'});
    } else if(g.nature==='Liability' && g.subCategory==='Current' && g.cf==='Operating'){
      const openingBal = l.openingType==='Cr' ? Number(l.openingBalance||0) : -Number(l.openingBalance||0);
      const closingBal = tbRow.cr - tbRow.dr;
      const change = closingBal - openingBal;
      if(Math.abs(change)>0.004) wc.push({name:l.name, amount:change, kind:'liability'});
    }
  });
  const totalWC = wc.reduce((s,x)=>s+x.amount,0);
  const netCashOperating = f.netProfit + totalNonCashAdj + totalWC;
  const direct = computeCashFlow();

  return {
    netProfit: f.netProfit,
    nonCashAdj, totalNonCashAdj,
    wc, totalWC,
    netCashOperating,
    investing: direct.buckets.Investing, totalInvesting: direct.totals.Investing,
    financing: direct.buckets.Financing, totalFinancing: direct.totals.Financing,
    openingCash: direct.openingCash, closingCash: direct.closingCash,
    netMovement: netCashOperating + direct.totals.Investing + direct.totals.Financing,
    directOperating: direct.totals.Operating
  };
}

    <button onclick="cfMethod='direct';render();" style="border:none;padding:7px 14px;font-size:12.5px;font-weight:500;cursor:pointer;background:${cfMethod==='direct'?'var(--ink)':'#fff'};color:${cfMethod==='direct'?'#fff':'var(--ink)'};border-left:1px solid var(--rule-strong);">Direct Method</button>
  </div>`;
}

function renderCashflow(){
  return cfMethod==='indirect' ? renderCashflowIndirect() : renderCashflowDirect();
}

function renderCashflowDirect(){

    const items = cf.buckets[key];
    const names = Object.keys(items);
    return `<tr class="group-row"><td colspan="2">${label}</td></tr>
      ${names.length? names.map(n=>`<tr><td style="padding-left:18px;">${esc(n)}</td><td class="num">${fmtSigned(items[n])}</td></tr>`).join('') : '<tr><td class="empty" colspan="2">No activity</td></tr>'}
      <tr class="subtotal"><td>Net Cash from ${label}</td><td class="num ${cf.totals[key]>=0?'pos':'neg'}">${fmtSigned(cf.totals[key])}</td></tr>`;
  };
  const reconDiff = (cf.closingCash - cf.openingCash) - cf.netMovement;
  return `

    </tbody></table>
    ${Math.abs(reconDiff)>0.01 ? `<p class="hint badge-bad">⚠ Reconciliation difference of ${fmt(reconDiff)} vs. trial balance closing cash (${fmt(cf.closingCash)}) — check for entries dated outside the current period, or group activity classifications marked "Excluded".</p>` : `<p class="hint badge-ok">✓ Reconciles with trial balance closing cash balance.</p>`}
  </div>`;
}
